---
workflow:
  rules:
    # merge requests
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event' &&
        $CI_MERGE_REQUEST_EVENT_TYPE != 'merge_train'
    # merge trains
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event' &&
        $CI_MERGE_REQUEST_EVENT_TYPE == 'merge_train'
    # tip of the default branch
    - if: $CI_PIPELINE_SOURCE == 'web' &&
        $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == 'push' &&
        $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    # scheduled pipelines
    - if: $CI_PIPELINE_SOURCE == 'schedule'

stages:
  - test
  - external
  - deploy

default:
  image: quay.io/hummingbird-ci/gitlab-ci:latest
  tags: [small-runner]
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - unknown_failure
      - api_failure
      - job_execution_timeout

.rules:
  mr:
    if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  push:
    if: $CI_PIPELINE_SOURCE == 'push' && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  web:
    if: $CI_PIPELINE_SOURCE == 'web' && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  schedule:
    if: $CI_PIPELINE_SOURCE == 'schedule' && $CI_JOB_NAME == $ONLY_JOB_NAME
  mr_manual:
    if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    when: manual
    allow_failure: true # allow to merge MR without running this job

.notify_schedule_failure: &notify_schedule_failure
  - |
    if [ "$CI_JOB_STATUS" == "failed" ] && [ "$CI_PIPELINE_SOURCE" == "schedule" ]; then
      if [ -z "$SLACK_WEBHOOK_URL" ]; then
        echo "WARNING: SLACK_WEBHOOK_URL is not set, skipping Slack notification"
      else
        MSG="⚠️ ${CI_JOB_NAME} scheduled pipeline failed: ${CI_JOB_URL}"
        # .ci_conflict_mrs.txt lists any MRs the job created that need manual
        # conflict resolution (see e.g. ci/dist_git_update_multi_mr.sh); the
        # job can still fail overall even when such MRs were created.
        if [ -s .ci_conflict_mrs.txt ]; then
          MSG="${MSG}\nMRs needing manual resolution:"
          while IFS= read -r line; do
            MSG="${MSG}\n- ${line}"
          done < .ci_conflict_mrs.txt
        fi
        curl -f --show-error -X POST -H 'Content-Type: application/json' \
          --data "$(jq -n --arg text "$MSG" '{text: $text}')" \
          "$SLACK_WEBHOOK_URL"
      fi
    fi

tree_status:
  stage: external
  script:
    - make generate-host
    - ./ci/tree_status.sh
  rules:
    - !reference [.rules, mr]
    - !reference [.rules, push]

check:
  tags: [big-runner]
  script:
    # Fetch full history for git commit trailer validation
    - git fetch --unshallow --quiet
    - make check-host
  rules:
    - !reference [.rules, mr]

# Predicts the NEVR(A) each changed package's spec would build and checks it
# against the public Pulp repo, to catch the case where a Release value
# already published (e.g. by another rebuild MR based on stale main) would
# conflict at publish time -- something Konflux's build-only validation does
# not check. Kept as its own job (rather than folded into `check`) since it
# depends on live Pulp/network state rather than being a pure offline lint,
# and `needs: [check]` so it only runs once the spec files are known-valid,
# without waiting on the rest of the test stage. See
# documentation/background/rpm-pipeline.md for details and known
# limitations (private products, the inherent race window).
check_nevr_conflicts:
  needs: ["check"]
  script:
    # Ensure the target branch ref is available locally for the MR diff.
    - git fetch --quiet origin "${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}"
    - make check-nevr-conflicts-host ARGS='--mr'
  rules:
    # Only schedule this job when an MR actually touches rpms/, matching
    # get_changed_rpm_packages()'s own filtering in check_nevr_conflicts.py.
    # metadata/**/*.json is deliberately excluded here (see that function's
    # docstring): a metadata-only change (e.g. `dist_git.py mark-modified`)
    # never causes Konflux to rebuild/republish anything.
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      changes:
        - rpms/**/*

deploy_components_to_konflux:
  variables:
    PARENT_PROJECT_PATH: $CI_PROJECT_PATH
    PARENT_MERGE_REQUEST_IID: $CI_MERGE_REQUEST_IID
    PARENT_COMMIT_SHA: $CI_COMMIT_SHA
    ONLY_JOB_NAME: rpms-components
  trigger:
    project: redhat/hummingbird/infrastructure
    strategy: depend
  allow_failure: true
  when: manual
  rules:
    - !reference [.rules, mr]
    - !reference [.rules, push]
    - !reference [.rules, web]

add_components_to_konflux:
  variables:
    PARENT_PROJECT_PATH: $CI_PROJECT_PATH
    PARENT_MERGE_REQUEST_IID: $CI_MERGE_REQUEST_IID
    PARENT_COMMIT_SHA: $CI_COMMIT_SHA
    PARENT_BASE_SHA: $CI_MERGE_REQUEST_DIFF_BASE_SHA
    ONLY_JOB_NAME: rpms-components-add
  trigger:
    project: redhat/hummingbird/infrastructure
    strategy: depend
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      changes:
        - konflux-templates/rendered.yml

deploy_releases_to_konflux:
  variables:
    PARENT_PROJECT_PATH: $CI_PROJECT_PATH
    ONLY_JOB_NAME: rpms-releases
  trigger:
    project: redhat/hummingbird/infrastructure
    strategy: depend
  allow_failure: true
  rules:
    - !reference [.rules, push]
    - !reference [.rules, web]

sync_releng:
  variables:
    PARENT_PROJECT_PATH: $CI_PROJECT_PATH
    PARENT_COMMIT_SHA: $CI_COMMIT_SHA
    ONLY_JOB_NAME: rpms-releng-sync
  trigger:
    project: redhat/hummingbird/infrastructure
    strategy: depend
  allow_failure: true
  rules:
    - !reference [.rules, push]
    - !reference [.rules, web]

dist_git_update:
  tags: [big-runner]
  environment:
    name: chore-mr
    action: access
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.com
  allow_failure: true
  before_script:
    - |
      git config --local user.name "${GITLAB_USER_NAME}"
      git config --local user.email "${GITLAB_USER_EMAIL}"
      git fetch --quiet origin
      git config --local credential.username ignored
      git config --local credential.helper "!echo \"password=\$CHORE_MR_GITLAB_TOKEN\"; :"
      # Workaround for GitLab Runner 18.6 MR !5912:
      # Remove include.path to .gitlab-runner.ext.conf which re-injects the read-only
      # gitlab-ci-token into the remote URL, preventing the credential helper from working.
      git config --local --unset-all include.path || true
      git branch --quiet --force "${CI_COMMIT_BRANCH:-$CI_DEFAULT_BRANCH}" "origin/${CI_COMMIT_BRANCH:-$CI_DEFAULT_BRANCH}"
  script:
    - |
      printenv GITLAB_OIDC_TOKEN > /tmp/oidc-token
      export AWS_WEB_IDENTITY_TOKEN_FILE=/tmp/oidc-token
      export AWS_ROLE_ARN="arn:aws:iam::${LOOKASIDE_UPLOAD_AWS_ACCOUNT_ID}:role/${LOOKASIDE_UPLOAD_AWS_ROLE_NAME}"
      export AWS_ROLE_SESSION_NAME="gitlab-ci-${CI_JOB_ID}"
      ./ci/dist_git_update_multi_mr.sh
  after_script: *notify_schedule_failure
  rules:
    - !reference [.rules, schedule]
    - !reference [.rules, mr_manual]

upstream_version_update:
  tags: [big-runner]
  environment:
    name: chore-mr
    action: access
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.com
  allow_failure: true
  before_script:
    - |
      git config --local user.name "${GITLAB_USER_NAME}"
      git config --local user.email "${GITLAB_USER_EMAIL}"
      git fetch --quiet origin
      git config --local credential.username ignored
      git config --local credential.helper "!echo \"password=\$CHORE_MR_GITLAB_TOKEN\"; :"
      # Workaround for GitLab Runner 18.6 MR !5912:
      # Remove include.path to .gitlab-runner.ext.conf which re-injects the read-only
      # gitlab-ci-token into the remote URL, preventing the credential helper from working.
      git config --local --unset-all include.path || true
      git branch --quiet --force "${CI_COMMIT_BRANCH:-$CI_DEFAULT_BRANCH}" "origin/${CI_COMMIT_BRANCH:-$CI_DEFAULT_BRANCH}"
  script:
    - |
      printenv GITLAB_OIDC_TOKEN > /tmp/oidc-token
      export AWS_WEB_IDENTITY_TOKEN_FILE=/tmp/oidc-token
      export AWS_ROLE_ARN="arn:aws:iam::${LOOKASIDE_UPLOAD_AWS_ACCOUNT_ID}:role/${LOOKASIDE_UPLOAD_AWS_ROLE_NAME}"
      export AWS_ROLE_SESSION_NAME="gitlab-ci-${CI_JOB_ID}"
      ./ci/upstream_update_multi_mr.sh
  after_script: *notify_schedule_failure
  rules:
    - !reference [.rules, schedule]
    - !reference [.rules, mr_manual]

chore_mr_approval:
  stage: deploy
  environment:
    name: chore-mr-approval
    action: access
  script:
    - python3 ci/check_konflux_statuses.py
    - gitlab
      --private-token "${CHORE_MR_APPROVAL_GITLAB_TOKEN}"
      project-merge-request approve
      --project-id "${CI_PROJECT_ID}"
      --iid "${CI_MERGE_REQUEST_IID}"
  allow_failure: true
  rules:
    - if: |
        ($GITLAB_USER_NAME != 'chore-mr') && (
          $GITLAB_USER_NAME != 'pipelines-as-code' ||
          $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME !~ /chore\//
        )
      when: never
    - !reference [.rules, mr]
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      when: delayed
      start_in: 10 minutes  # give Konflux some time to post its commit statuses

trigger_documentation:
  stage: deploy
  variables:
    PARENT_PROJECT_PATH: $CI_PROJECT_PATH
  trigger:
    project: redhat/hummingbird/documentation
    strategy: depend
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE =~ 'push|web' && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - documentation/**/*
        - README.md
        - CONTRIBUTING.md
    - !reference [.rules, mr_manual]
