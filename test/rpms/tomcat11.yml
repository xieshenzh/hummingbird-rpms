---
# Tests specific to the tomcat11 package

no-systemd-runtime-dependency:
  command: |
    # Verify that the tomcat11 package does not have a runtime dependency on
    # systemd.  It should use systemd_ordering (weak ordering) instead of a
    # hard dependency.
    rpm_name=$(rpm -qp --queryformat '%{NAME}' "${TEST_RPM}")
    if [[ "${rpm_name}" != "tomcat11" ]]; then
      echo "Skipping: This test only runs on tomcat11 (got: ${rpm_name})"
      exit 0
    fi

    requires=$(rpm -qRp "${TEST_RPM}")
    if echo "${requires}" | grep -qxF "systemd"; then
      TEST_FAIL "tomcat11 has a hard runtime dependency on systemd"
    else
      echo "PASS: tomcat11 does not require systemd at runtime"
    fi
