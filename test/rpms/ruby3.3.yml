---
# Tests for the ruby3.3 package
# Verify unversioned Provides and Fedora-compatible filesystem paths

provides-ruby:
  command: |
    # Verify the main ruby3.3 package provides unversioned 'ruby'
    rpm_name=$(rpm -qp --queryformat '%{NAME}' "${TEST_RPM}")
    if [[ "${rpm_name}" != "ruby3.3" ]]; then
      echo "Skipping: This test only runs on ruby3.3 (got: ${rpm_name})"
      exit 0
    fi

    provides=$(rpm -qp --provides "${TEST_RPM}")
    if echo "${provides}" | grep -q "^ruby = "; then
      echo "PASS: ruby3.3 provides unversioned 'ruby'"
      echo "${provides}" | grep "^ruby = "
    else
      TEST_FAIL "ruby3.3 does not provide unversioned 'ruby'"
    fi

