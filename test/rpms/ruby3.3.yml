paths-libs-use-ruby-not-ruby4:
  command: |
    # Verify ruby3.3-libs installs to /usr/lib64/ruby/ not /usr/lib64/ruby3.3/
    rpm_name=$(rpm -qp --queryformat '%{NAME}' "${TEST_RPM}")
    if [[ "${rpm_name}" != "ruby3.3-libs" ]]; then
      echo "Skipping: This test only runs on ruby3.3-libs (got: ${rpm_name})"
      exit 0
    fi

    files=$(rpm -qlp "${TEST_RPM}")
    if echo "${files}" | grep -q "^/usr/lib64/ruby/"; then
      echo "PASS: ruby3.3-libs installs to /usr/lib64/ruby/"
    else
      TEST_FAIL "ruby3.3-libs does not install to /usr/lib64/ruby/"
    fi

    if echo "${files}" | grep -q "^/usr/lib64/ruby3.3/"; then
      TEST_FAIL "ruby3.3-libs still uses versioned path /usr/lib64/ruby3.3/"
    else
      echo "PASS: No files under /usr/lib64/ruby3.3/"
    fi

    if echo "${files}" | grep -q "^/usr/share/ruby/"; then
      echo "PASS: ruby3.3-libs installs to /usr/share/ruby/"
    else
      TEST_FAIL "ruby3.3-libs does not install to /usr/share/ruby/"
    fi

paths-devel-use-ruby-not-ruby4:
  command: |
    # Verify ruby3.3-devel installs headers to /usr/include/ruby/ not /usr/include/ruby3.3/
    rpm_name=$(rpm -qp --queryformat '%{NAME}' "${TEST_RPM}")
    if [[ "${rpm_name}" != "ruby3.3-devel" ]]; then
      echo "Skipping: This test only runs on ruby3.3-devel (got: ${rpm_name})"
      exit 0
    fi

    files=$(rpm -qlp "${TEST_RPM}")
    if echo "${files}" | grep -q "^/usr/include/ruby"; then
      echo "PASS: ruby3.3-devel installs headers under /usr/include/"
    else
      TEST_FAIL "ruby3.3-devel does not install headers under /usr/include/"
    fi

paths-gem-extensions-use-ruby:
  command: |
    # Verify gem extension directories use /usr/lib64/gems/ruby/ not /usr/lib64/gems/ruby3.3/
    rpm_name=$(rpm -qp --queryformat '%{NAME}' "${TEST_RPM}")
    if [[ "${rpm_name}" != "rubygem3.3-json" ]]; then
      echo "Skipping: This test only runs on rubygem3.3-json (got: ${rpm_name})"
      exit 0
    fi

    files=$(rpm -qlp "${TEST_RPM}")
    if echo "${files}" | grep -q "^/usr/lib64/gems/ruby/"; then
      echo "PASS: gem extensions install to /usr/lib64/gems/ruby/"
      echo "${files}" | grep "^/usr/lib64/gems/ruby/" | head -3
    else
      TEST_FAIL "gem extensions do not install to /usr/lib64/gems/ruby/"
    fi

    if echo "${files}" | grep -q "^/usr/lib64/gems/ruby3.3/"; then
      TEST_FAIL "gem extensions still use versioned path /usr/lib64/gems/ruby3.3/"
    else
      echo "PASS: No files under /usr/lib64/gems/ruby3.3/"
    fi


paths-pkgconfig:
  command: |
    # Verify ruby3.3-devel installs ruby.pc (not ruby3.3.pc)
    rpm_name=$(rpm -qp --queryformat '%{NAME}' "${TEST_RPM}")
    if [[ "${rpm_name}" != "ruby3.3-devel" ]]; then
      echo "Skipping: This test only runs on ruby3.3-devel (got: ${rpm_name})"
      exit 0
    fi

    files=$(rpm -qlp "${TEST_RPM}")
    if echo "${files}" | grep -q "pkgconfig/ruby.pc"; then
      echo "PASS: ruby3.3-devel provides ruby.pc"
    else
      TEST_FAIL "ruby3.3-devel does not provide ruby.pc"
    fi
