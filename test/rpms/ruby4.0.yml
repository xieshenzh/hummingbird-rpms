---
# Tests for the ruby4.0 package
# Verify unversioned Provides and Fedora-compatible filesystem paths

provides-ruby:
  command: |
    # Verify the main ruby4.0 package provides unversioned 'ruby'
    rpm_name=$(rpm -qp --queryformat '%{NAME}' "${TEST_RPM}")
    if [[ "${rpm_name}" != "ruby4.0" ]]; then
      echo "Skipping: This test only runs on ruby4.0 (got: ${rpm_name})"
      exit 0
    fi

    provides=$(rpm -qp --provides "${TEST_RPM}")
    if echo "${provides}" | grep -q "^ruby = "; then
      echo "PASS: ruby4.0 provides unversioned 'ruby'"
      echo "${provides}" | grep "^ruby = "
    else
      TEST_FAIL "ruby4.0 does not provide unversioned 'ruby'"
    fi

