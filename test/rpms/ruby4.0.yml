paths-libs-use-ruby-not-ruby4:
  command: |
    # Verify ruby4.0-libs installs to /usr/lib64/ruby/ not /usr/lib64/ruby4.0/
    rpm_name=$(rpm -qp --queryformat '%{NAME}' "${TEST_RPM}")
    if [[ "${rpm_name}" != "ruby4.0-libs" ]]; then
      echo "Skipping: This test only runs on ruby4.0-libs (got: ${rpm_name})"
      exit 0
    fi

    files=$(rpm -qlp "${TEST_RPM}")
    if echo "${files}" | grep -q "^/usr/lib64/ruby/"; then
      echo "PASS: ruby4.0-libs installs to /usr/lib64/ruby/"
    else
      TEST_FAIL "ruby4.0-libs does not install to /usr/lib64/ruby/"
    fi

    if echo "${files}" | grep -q "^/usr/lib64/ruby4.0/"; then
      TEST_FAIL "ruby4.0-libs still uses versioned path /usr/lib64/ruby4.0/"
    else
      echo "PASS: No files under /usr/lib64/ruby4.0/"
    fi

    if echo "${files}" | grep -q "^/usr/share/ruby/"; then
      echo "PASS: ruby4.0-libs installs to /usr/share/ruby/"
    else
      TEST_FAIL "ruby4.0-libs does not install to /usr/share/ruby/"
    fi

paths-devel-use-ruby-not-ruby4:
  command: |
    # Verify ruby4.0-devel installs headers to /usr/include/ruby/ not /usr/include/ruby4.0/
    rpm_name=$(rpm -qp --queryformat '%{NAME}' "${TEST_RPM}")
    if [[ "${rpm_name}" != "ruby4.0-devel" ]]; then
      echo "Skipping: This test only runs on ruby4.0-devel (got: ${rpm_name})"
      exit 0
    fi

    files=$(rpm -qlp "${TEST_RPM}")
    if echo "${files}" | grep -q "^/usr/include/ruby"; then
      echo "PASS: ruby4.0-devel installs headers under /usr/include/"
    else
      TEST_FAIL "ruby4.0-devel does not install headers under /usr/include/"
    fi

paths-gem-extensions-use-ruby:
  command: |
    # Verify gem extension directories use /usr/lib64/gems/ruby/ not /usr/lib64/gems/ruby4.0/
    rpm_name=$(rpm -qp --queryformat '%{NAME}' "${TEST_RPM}")
    if [[ "${rpm_name}" != "rubygem4.0-json" ]]; then
      echo "Skipping: This test only runs on rubygem4.0-json (got: ${rpm_name})"
      exit 0
    fi

    files=$(rpm -qlp "${TEST_RPM}")
    if echo "${files}" | grep -q "^/usr/lib64/gems/ruby/"; then
      echo "PASS: gem extensions install to /usr/lib64/gems/ruby/"
      echo "${files}" | grep "^/usr/lib64/gems/ruby/" | head -3
    else
      TEST_FAIL "gem extensions do not install to /usr/lib64/gems/ruby/"
    fi

    if echo "${files}" | grep -q "^/usr/lib64/gems/ruby4.0/"; then
      TEST_FAIL "gem extensions still use versioned path /usr/lib64/gems/ruby4.0/"
    else
      echo "PASS: No files under /usr/lib64/gems/ruby4.0/"
    fi

paths-ruby-binary:
  command: |
    # Verify ruby4.0 package includes a ruby binary.
    # When rubypick is in use (the default), ruby4.0 ships /usr/bin/ruby-mri
    # and rubypick owns /usr/bin/ruby.  Without rubypick, ruby4.0 owns
    # /usr/bin/ruby directly.
    rpm_name=$(rpm -qp --queryformat '%{NAME}' "${TEST_RPM}")
    if [[ "${rpm_name}" != "ruby4.0" ]]; then
      echo "Skipping: This test only runs on ruby4.0 (got: ${rpm_name})"
      exit 0
    fi

    files=$(rpm -qlp "${TEST_RPM}")
    if echo "${files}" | grep -q "^/usr/bin/ruby$"; then
      echo "PASS: ruby4.0 includes /usr/bin/ruby"
    elif echo "${files}" | grep -q "^/usr/bin/ruby4.0-mri$"; then
      echo "PASS: ruby4.0 includes /usr/bin/ruby4.0-mri (rubypick mode)"
    else
      TEST_FAIL "ruby4.0 does not include /usr/bin/ruby or /usr/bin/ruby4.0-mri"
    fi

paths-pkgconfig:
  command: |
    # Verify ruby4.0-devel installs ruby.pc (not ruby4.0.pc)
    rpm_name=$(rpm -qp --queryformat '%{NAME}' "${TEST_RPM}")
    if [[ "${rpm_name}" != "ruby4.0-devel" ]]; then
      echo "Skipping: This test only runs on ruby4.0-devel (got: ${rpm_name})"
      exit 0
    fi

    files=$(rpm -qlp "${TEST_RPM}")
    if echo "${files}" | grep -q "pkgconfig/ruby.pc"; then
      echo "PASS: ruby4.0-devel provides ruby.pc"
    else
      TEST_FAIL "ruby4.0-devel does not provide ruby.pc"
    fi
