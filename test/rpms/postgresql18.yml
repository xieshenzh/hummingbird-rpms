    "${TEST_ENGINE}" run --rm \
      -v "${build_dir}/local-repo:/tmp/local-repo:ro,z" \
      quay.io/hummingbird-ci/hummingbird-builder:latest \
      bash -c '
        set -e
        printf "[local-repo]\nname=Local\nbaseurl=file:///tmp/local-repo\nenabled=1\ngpgcheck=0\npriority=1\n" \
          > /etc/yum.repos.d/local.repo
        dnf install -y postgresql18-server postgresql18-plperl postgresql18-contrib

        runuser -u postgres -- initdb -D /var/lib/pgsql/data
        runuser -u postgres -- pg_ctl -D /var/lib/pgsql/data -l /var/lib/pgsql/log start
        sleep 2

        runuser -u postgres -- psql -c "CREATE EXTENSION plperl;"
        echo "PASS: plperl extension created"

        runuser -u postgres -- psql -c "CREATE EXTENSION plperlu;"
        echo "PASS: plperlu extension created"

        runuser -u postgres -- psql -c "CREATE EXTENSION hstore;"
        runuser -u postgres -- psql -c "CREATE EXTENSION hstore_plperl;"
        echo "PASS: hstore_plperl extension created"

        runuser -u postgres -- psql -c "CREATE EXTENSION jsonb_plperl;"
        echo "PASS: jsonb_plperl extension created"

        result=$(runuser -u postgres -- psql -t -c "
          CREATE FUNCTION perl_hello() RETURNS text AS \$\$
            return \"hello from plperl\";
          \$\$ LANGUAGE plperlu;
          SELECT perl_hello();
        ")
        echo "PL/Perl result: ${result}"
        if echo "${result}" | grep -q "hello from plperl"; then
          echo "PASS: PL/Perl function executed successfully"
        else
          echo "FAIL: PL/Perl function returned unexpected result"
          exit 1
        fi

        runuser -u postgres -- pg_ctl -D /var/lib/pgsql/data stop
      '
