---
# Tests for etcd: verify binaries install correctly, version is embedded
# via ldflags, and basic key-value operations work.

etcd-version:
  command: |
    rpm_name=$(rpm -qp --queryformat '%{NAME}' "${TEST_RPM}")
    if [[ "${rpm_name}" != "etcd" ]]; then
      echo "Skipping: only runs on etcd (got: ${rpm_name})"
      exit 0
    fi

    "${TEST_ENGINE}" run --rm \
      -v "${TEST_RPM}:/tmp/test.rpm:ro,z" \
      quay.io/hummingbird-ci/hummingbird-builder:latest \
      bash -c '
        set -euo pipefail
        dnf install -y /tmp/test.rpm

        rpm_version=$(rpm -q --queryformat "%{VERSION}" etcd)
        version=$(etcd --version 2>&1 | sed -n "s/^etcd Version: *//p")

        if [[ -z "${version}" ]]; then
          echo "FAIL: Version field is empty"
          exit 1
        fi

        if [[ "${version}" != "${rpm_version}" ]]; then
          echo "FAIL: etcd reports \"${version}\", expected \"${rpm_version}\""
          exit 1
        fi

        echo "PASS: etcd version ${version}"
      '

