etcd-functional:
  command: |
    rpm_name=$(rpm -qp --queryformat '%{NAME}' "${TEST_RPM}")
    if [[ "${rpm_name}" != "etcd" ]]; then
      echo "Skipping: only runs on etcd (got: ${rpm_name})"
      exit 0
    fi

    "${TEST_ENGINE}" run --rm \
      -v "${TEST_RPM}:/tmp/test.rpm:ro,z" \
      quay.io/hummingbird-ci/hummingbird-builder:latest \
      bash -c '
        set -euo pipefail
        dnf install -y /tmp/test.rpm

        datadir=$(mktemp -d)
        etcd --data-dir "${datadir}" \
             --listen-client-urls http://127.0.0.1:2379 \
             --advertise-client-urls http://127.0.0.1:2379 \
             --listen-peer-urls http://127.0.0.1:2380 &
        etcd_pid=$!
        trap '\''kill $etcd_pid 2>/dev/null; rm -rf $datadir'\'' EXIT

        for i in $(seq 1 30); do
          if etcdctl --endpoints=http://127.0.0.1:2379 endpoint health 2>/dev/null; then
            break
          fi
          sleep 1
        done

        # put/get round-trip
        etcdctl --endpoints=http://127.0.0.1:2379 put testkey "hello etcd"
        value=$(etcdctl --endpoints=http://127.0.0.1:2379 get testkey --print-value-only)

        if [[ "${value}" != "hello etcd" ]]; then
          echo "FAIL: expected \"hello etcd\", got \"${value}\""
          exit 1
        fi

        echo "PASS: put/get round-trip works"

        # member list
        member_output=$(etcdctl --endpoints=http://127.0.0.1:2379 member list 2>&1)
        if [[ "${member_output}" != *"default"* ]]; then
          echo "FAIL: member list missing default member: ${member_output}"
          exit 1
        fi

        echo "PASS: member list shows default member"
      '
