---
# Tests specific to the tomcat10 package

no-systemd-runtime-dependency:
  command: |
    # Verify that the tomcat10 package does not have a runtime dependency on
    # systemd.  It should use systemd_ordering (weak ordering) instead of a
    # hard dependency.
    rpm_name=$(rpm -qp --queryformat '%{NAME}' "${TEST_RPM}")
    if [[ "${rpm_name}" != "tomcat10" ]]; then
      echo "Skipping: This test only runs on tomcat10 (got: ${rpm_name})"
      exit 0
    fi

    requires=$(rpm -qRp "${TEST_RPM}")
    if echo "${requires}" | grep -qxF "systemd"; then
      TEST_FAIL "tomcat10 has a hard runtime dependency on systemd"
    else
      echo "PASS: tomcat10 does not require systemd at runtime"
    fi

supports-multiple-java-runtime-versions:
  command: |
    rpm_name=$(rpm -qp --queryformat '%{NAME}' "${TEST_RPM}")
    if [[ "${rpm_name}" != "tomcat10-common" ]]; then
      echo "Skipping: This test only runs on tomcat10-common (got: ${rpm_name})"
      exit 0
    fi

    expected="(java-headless >= 1:11 or java >= 1:11)"
    requires=$(rpm -qRp "${TEST_RPM}")
    if echo "${requires}" | grep -qxF "${expected}"; then
      echo "PASS: tomcat10 supports any Java 11 or later runtime"
    else
      TEST_FAIL "tomcat10 must require '${expected}' without pinning a Java feature release"
    fi
