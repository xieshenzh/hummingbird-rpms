---
# Tests for hummingbird-release package
# Verifies GPG signature verification is enabled and working

gpg-signature-verification:
  summary: Install hummingbird-release and verify GPG-signed package installation works
  command: |
    rpm_name=$(rpm -qp --queryformat '%{NAME}' "${TEST_RPM}")
    if [[ "${rpm_name}" != "hummingbird-repos" ]]; then
      echo "Skipping: This test only runs on hummingbird-repos (got: ${rpm_name})"
      exit 0
    fi

    # Setup: create local repo with our RPMs
    build_dir=$(mktemp -d)
    trap 'rm -rf "${build_dir}"' EXIT
    mkdir -p "${build_dir}/local-repo"

    if [[ -n ${TEST_REPO_DIR:-} ]]; then
      cp "${TEST_REPO_DIR}"/*.rpm "${build_dir}/local-repo/"
    else
      cp "${TEST_RPM}" "${build_dir}/local-repo/"
    fi

    createrepo_c "${build_dir}/local-repo" || \
      "${TEST_ENGINE}" run --rm --user 0 -v "${build_dir}/local-repo:/repo:z" \
        quay.io/hummingbird-ci/hummingbird-builder:latest createrepo_c /repo

    "${TEST_ENGINE}" run --rm --user 0 \
      -v "${CI_REPOS_DIR}:/tmp/repos:ro,z" \
      -v "${build_dir}/local-repo:/tmp/local-repo:ro,z" \
      "${TEST_IMAGE}" \
      bash -c '
        set -e

        # Setup repos - use local repo (gpgcheck=0) only for installing
        # our own hummingbird-release packages
        cp /tmp/repos/fedora-44.repo /etc/yum.repos.d/
        printf "%s\n" \
          "[local-repo]" \
          "name=Local Repository" \
          "baseurl=file:///tmp/local-repo" \
          "enabled=1" \
          "gpgcheck=0" \
          "priority=1" \
          > /etc/yum.repos.d/local.repo

        DNF_FLAGS="-y --nodocs --setopt=install_weak_deps=False"

        # Remove GPG keys and repo files from disk so we start from a
        # clean state. The dnf remove of hummingbird packages will fail
        # in container images where they are essential OS dependencies
        # (everything depends on system-release), so we do not rely on it.
        rm -f /etc/pki/rpm-gpg/RPM-GPG-KEY-*
        rm -f /etc/yum.repos.d/*hummingbird*.repo
        for key in $(rpm -qa gpg-pubkey*); do
          rpm -e "${key}"
        done

        # Force-(re)install our packages from the local repo. Use reinstall
        # to handle the common case where the container image already has
        # the same NEVRA installed (dnf install would be a no-op). Fall back
        # to install for clean environments where they are not yet present.
        dnf ${DNF_FLAGS} reinstall \
          hummingbird-release \
          hummingbird-repos \
          hummingbird-gpg-keys 2>/dev/null || \
        dnf ${DNF_FLAGS} install \
          hummingbird-release \
          hummingbird-repos \
          hummingbird-gpg-keys

        # Verify gpgcheck=1 is active in all installed repo configs
        readarray -t repo_files < <(rpm -ql hummingbird-repos | grep '/etc/yum\.repos\.d/.*\.repo$')
        if [[ ${#repo_files[@]} -eq 0 ]]; then
          echo "FAIL: no .repo file found in installed hummingbird-repos package"
          exit 1
        fi
        for installed_repo in "${repo_files[@]}"; do
          if ! grep -q "^gpgcheck=1" "${installed_repo}"; then
            echo "FAIL: gpgcheck=1 not found in installed ${installed_repo}"
            cat "${installed_repo}"
            exit 1
          fi
          echo "Verified: gpgcheck=1 is set in ${installed_repo}"
        done

        # Verify GPG key was installed
        gpg_key="/etc/pki/rpm-gpg/RPM-GPG-KEY-hummingbird-release"
        if [[ ! -f ${gpg_key} ]]; then
          echo "FAIL: GPG key not found at ${gpg_key}"
          exit 1
        fi
        echo "Verified: GPG key installed at ${gpg_key}"

        # Import the GPG key into the RPM database
        rpmkeys --import "${gpg_key}"

        # Disable the local repo so dnf only uses the hummingbird repo
        # (which now has gpgcheck=1)
        dnf config-manager --set-disabled local-repo 2>/dev/null || \
          sed -i "s/enabled=1/enabled=0/" /etc/yum.repos.d/local.repo

        # Install procps-ng from the hummingbird repo with GPG verification.
        # With gpgcheck=1, dnf will verify the RPM signature during the install
        # transaction and refuse to install if the signature is invalid or missing.
        echo ""
        echo "=== Installing procps-ng with GPG signature verification ==="
        dnf ${DNF_FLAGS} install procps-ng

        # Verify procps-ng was installed from the hummingbird repo, confirming
        # that dnf successfully verified the signature during the install
        install_repo=$(dnf info --installed procps-ng 2>/dev/null | \
          grep "^From repo" | cut -d: -f2 | tr -d " ")
        echo "procps-ng installed from repo: ${install_repo}"
        expected_repo="public-hummingbird-$(uname -m)-rpms"
        if [[ "${install_repo}" != "${expected_repo}" ]]; then
          echo "FAIL: procps-ng was not installed from ${expected_repo} (got: ${install_repo})"
          exit 1
        fi

        echo ""
        echo "SUCCESS: procps-ng installed from ${expected_repo} with gpgcheck=1"
      '

repo-names-match-convention:
  summary: Verify .repo file uses consistent repo IDs matching the Pulp repository names
  command: |
    rpm_name=$(rpm -qp --queryformat '%{NAME}' "${TEST_RPM}")
    if [[ "${rpm_name}" != "hummingbird-repos" ]]; then
      echo "Skipping: This test only runs on hummingbird-repos (got: ${rpm_name})"
      exit 0
    fi

    repo_file=$(rpm -qpl "${TEST_RPM}" | grep '\.repo$')
    if [[ -z "${repo_file}" ]]; then
      echo "FAIL: No .repo file found in package"
      exit 1
    fi

    # Extract repo IDs from the .repo file inside the RPM
    repo_ids=$(rpm -qp --dump "${TEST_RPM}" 2>/dev/null | head -0; \
      rpm2cpio "${TEST_RPM}" | cpio -i --to-stdout ".${repo_file}" 2>/dev/null | \
      grep '^\[' | tr -d '[]')

    echo "Found repo IDs: ${repo_ids}"

    # Verify binary repo uses public-hummingbird-$basearch-rpms pattern
    if ! echo "${repo_ids}" | grep -q '^public-hummingbird-\$basearch-rpms$'; then
      echo "FAIL: Expected repo ID 'public-hummingbird-\$basearch-rpms' not found"
      echo "Got: ${repo_ids}"
      exit 1
    fi
    echo "Verified: binary repo ID matches public-hummingbird-\$basearch-rpms"

    # Verify source repo uses public-hummingbird-source-rpms
    if ! echo "${repo_ids}" | grep -q '^public-hummingbird-source-rpms$'; then
      echo "FAIL: Expected repo ID 'public-hummingbird-source-rpms' not found"
      echo "Got: ${repo_ids}"
      exit 1
    fi
    echo "Verified: source repo ID matches public-hummingbird-source-rpms"

    echo ""
    echo "SUCCESS: All repo IDs follow the consistent naming convention"
