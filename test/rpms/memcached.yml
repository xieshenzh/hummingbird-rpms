---
# Tests specific to the memcached package

no-systemd-runtime-dependency:
  command: |
    # Verify that the memcached package does not have a runtime dependency on
    # systemd.  It should use systemd_ordering (weak ordering) instead of
    # systemd_requires (hard dependency).
    rpm_name=$(rpm -qp --queryformat '%{NAME}' "${TEST_RPM}")
    if [[ "${rpm_name}" != "memcached" ]]; then
      echo "Skipping: This test only runs on memcached (got: ${rpm_name})"
      exit 0
    fi

    requires=$(rpm -qRp "${TEST_RPM}")
    if echo "${requires}" | grep -qxF "systemd"; then
      TEST_FAIL "memcached has a hard runtime dependency on systemd"
    else
      echo "PASS: memcached does not require systemd at runtime"
    fi
