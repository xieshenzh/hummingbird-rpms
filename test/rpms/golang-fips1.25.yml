---
# Tests specific to the golang-fips1.25 package

fips-openssl-requirement:
  command: |
    # Verify the golang-fips package requires openssl-devel at runtime.
    # This dependency is only added when the FIPS build is enabled.
    rpm_name=$(rpm -qp --queryformat '%{NAME}' "${TEST_RPM}")
    if [[ "${rpm_name}" != "golang-fips1.25" ]]; then
      echo "Skipping: This test only runs on golang-fips1.25 (got: ${rpm_name})"
      exit 0
    fi

    requires=$(rpm -qRp "${TEST_RPM}")
    if echo "${requires}" | grep -q "openssl-devel"; then
      echo "PASS: golang-fips1.25 requires openssl-devel"
    else
      TEST_FAIL "golang-fips1.25 does not require openssl-devel - FIPS mode was not enabled during build"
    fi

fips-provides:
  command: |
    # Verify the package provides golang-fips
    rpm_name=$(rpm -qp --queryformat '%{NAME}' "${TEST_RPM}")
    if [[ "${rpm_name}" != "golang-fips1.25" ]]; then
      echo "Skipping: This test only runs on golang-fips1.25 (got: ${rpm_name})"
      exit 0
    fi

    provides=$(rpm -qp --provides "${TEST_RPM}")
    if echo "${provides}" | grep -q "golang-fips"; then
      echo "PASS: Package provides golang-fips"
      echo "${provides}" | grep "golang-fips"
    else
      TEST_FAIL "Package does not provide golang-fips"
    fi

fips-build-cgo-enabled:
  command: |
    # Build and run a Go program with CGO_ENABLED=1 and GOLANG_FIPS=1.
    # This is the primary FIPS-compliant path: crypto operations are routed
    # through OpenSSL via dynamic linkage.
    rpm_name=$(rpm -qp --queryformat '%{NAME}' "${TEST_RPM}")
    if [[ "${rpm_name}" != "golang-fips1.25-bin" ]]; then
      echo "Skipping: This test only runs on golang-fips1.25-bin (got: ${rpm_name})"
      exit 0
    fi

    build_dir=$(mktemp -d)
    cleanup() { rm -rf "${build_dir}"; }
    trap cleanup EXIT

    mkdir -p "${build_dir}/local-repo"
    if [[ -n ${TEST_REPO_DIR:-} ]]; then
      cp "${TEST_REPO_DIR}"/*.rpm "${build_dir}/local-repo/"
    else
      cp "${TEST_RPM}" "${build_dir}/local-repo/"
    fi
    createrepo_c "${build_dir}/local-repo" || \
      "${TEST_ENGINE}" run --rm --user 0 -v "${build_dir}/local-repo:/repo:z" \
        quay.io/hummingbird-ci/hummingbird-builder:latest createrepo_c /repo

    test_files_dir="${TEST_FILES_DIR:-$(git rev-parse --show-toplevel)/test/rpms/golang-fips1.25}"

    "${TEST_ENGINE}" run --rm \
      -v "${build_dir}/local-repo:/tmp/local-repo:ro,z" \
      -v "${test_files_dir}:/tmp/test-files:ro,z" \
      quay.io/hummingbird-ci/hummingbird-builder:latest \
      bash -c '
        set -e
        printf "[local-repo]\nname=Local\nbaseurl=file:///tmp/local-repo\nenabled=1\ngpgcheck=0\npriority=1\n" \
          > /etc/yum.repos.d/local.repo
        dnf install -y golang-fips1.25-bin golang-fips1.25 golang-fips1.25-src gcc openssl-devel

        export HOME=/tmp GOPATH=/tmp/gopath GOCACHE=/tmp/gocache
        export GOLANG_FIPS=1 OPENSSL_FORCE_FIPS_MODE=1
        export CGO_ENABLED=1

        mkdir -p /tmp/build
        cp /tmp/test-files/crypto_test.go /tmp/build/main.go
        cd /tmp/build
        go mod init fips-test
        go build -o ./testbin .
        echo "CGO_ENABLED=1 build succeeded"

        ./testbin
        echo "PASS: CGO_ENABLED=1 binary ran successfully with FIPS enabled"
      '

fips-build-cgo-disabled:
  command: |
    # Build and run a Go program with CGO_ENABLED=0 and GOLANG_FIPS=1.
    # With CGO disabled the binary cannot dlopen libcrypto, so it silently
    # falls back to pure-Go crypto.  This is NOT FIPS compliant, but the
    # binary must still compile and run without crashing.
    rpm_name=$(rpm -qp --queryformat '%{NAME}' "${TEST_RPM}")
    if [[ "${rpm_name}" != "golang-fips1.25-bin" ]]; then
      echo "Skipping: This test only runs on golang-fips1.25-bin (got: ${rpm_name})"
      exit 0
    fi

    build_dir=$(mktemp -d)
    cleanup() { rm -rf "${build_dir}"; }
    trap cleanup EXIT

    mkdir -p "${build_dir}/local-repo"
    if [[ -n ${TEST_REPO_DIR:-} ]]; then
      cp "${TEST_REPO_DIR}"/*.rpm "${build_dir}/local-repo/"
    else
      cp "${TEST_RPM}" "${build_dir}/local-repo/"
    fi
    createrepo_c "${build_dir}/local-repo" || \
      "${TEST_ENGINE}" run --rm --user 0 -v "${build_dir}/local-repo:/repo:z" \
        quay.io/hummingbird-ci/hummingbird-builder:latest createrepo_c /repo

    test_files_dir="${TEST_FILES_DIR:-$(git rev-parse --show-toplevel)/test/rpms/golang-fips1.25}"

    "${TEST_ENGINE}" run --rm \
      -v "${build_dir}/local-repo:/tmp/local-repo:ro,z" \
      -v "${test_files_dir}:/tmp/test-files:ro,z" \
      quay.io/hummingbird-ci/hummingbird-builder:latest \
      bash -c '
        set -e
        printf "[local-repo]\nname=Local\nbaseurl=file:///tmp/local-repo\nenabled=1\ngpgcheck=0\npriority=1\n" \
          > /etc/yum.repos.d/local.repo
        dnf install -y golang-fips1.25-bin golang-fips1.25 golang-fips1.25-src gcc openssl-devel

        export HOME=/tmp GOPATH=/tmp/gopath GOCACHE=/tmp/gocache
        export CGO_ENABLED=0

        mkdir -p /tmp/build
        cp /tmp/test-files/crypto_test.go /tmp/build/main.go
        cd /tmp/build
        go mod init fips-test
        go build -o ./testbin .
        echo "CGO_ENABLED=0 build succeeded"

        ./testbin
        echo "PASS: CGO_ENABLED=0 binary compiled and ran (falls back to Go crypto)"
      '

fips-strict-mode-panic:
  command: |
    # Build a binary with GOEXPERIMENT=strictfipsruntime, then hide
    # libcrypto.so so the runtime cannot load OpenSSL.  With GOLANG_FIPS=1
    # the binary should panic at startup.
    # See https://github.com/golang-fips/go#strict-fips-mode
    rpm_name=$(rpm -qp --queryformat '%{NAME}' "${TEST_RPM}")
    if [[ "${rpm_name}" != "golang-fips1.25-bin" ]]; then
      echo "Skipping: This test only runs on golang-fips1.25-bin (got: ${rpm_name})"
      exit 0
    fi

    build_dir=$(mktemp -d)
    cleanup() { rm -rf "${build_dir}"; }
    trap cleanup EXIT

    mkdir -p "${build_dir}/local-repo"
    if [[ -n ${TEST_REPO_DIR:-} ]]; then
      cp "${TEST_REPO_DIR}"/*.rpm "${build_dir}/local-repo/"
    else
      cp "${TEST_RPM}" "${build_dir}/local-repo/"
    fi
    createrepo_c "${build_dir}/local-repo" || \
      "${TEST_ENGINE}" run --rm --user 0 -v "${build_dir}/local-repo:/repo:z" \
        quay.io/hummingbird-ci/hummingbird-builder:latest createrepo_c /repo

    test_files_dir="${TEST_FILES_DIR:-$(git rev-parse --show-toplevel)/test/rpms/golang-fips1.25}"

    "${TEST_ENGINE}" run --rm \
      -v "${build_dir}/local-repo:/tmp/local-repo:ro,z" \
      -v "${test_files_dir}:/tmp/test-files:ro,z" \
      quay.io/hummingbird-ci/hummingbird-builder:latest \
      bash -c '
        set -e
        printf "[local-repo]\nname=Local\nbaseurl=file:///tmp/local-repo\nenabled=1\ngpgcheck=0\npriority=1\n" \
          > /etc/yum.repos.d/local.repo
        dnf install -y golang-fips1.25-bin golang-fips1.25 golang-fips1.25-src gcc openssl-devel

        export HOME=/tmp GOPATH=/tmp/gopath GOCACHE=/tmp/gocache
        export GOEXPERIMENT=strictfipsruntime

        mkdir -p /tmp/build
        cp /tmp/test-files/crypto_test.go /tmp/build/main.go
        cd /tmp/build
        go mod init fips-test
        go build -o ./testbin .
        echo "strictfipsruntime build succeeded"

        # Hide libcrypto so the binary cannot find OpenSSL at runtime
        libcrypto_files=$(find /usr/lib64 /usr/lib -name "libcrypto.so*" 2>/dev/null || true)
        for f in ${libcrypto_files}; do
          mv "${f}" "${f}.hidden"
        done
        echo "Hidden libcrypto files: ${libcrypto_files}"

        # Run with FIPS forced -- the binary should panic because it
        # cannot load OpenSSL.
        export GOLANG_FIPS=1
        export OPENSSL_FORCE_FIPS_MODE=1

        if ./testbin 2>&1; then
          echo "FAIL: binary should have panicked but exited successfully"
          exit 1
        fi

        # Verify the failure was actually a FIPS-related panic
        output=$(./testbin 2>&1 || true)
        if echo "${output}" | grep -qiE "panic|fips"; then
          echo "PASS: binary panicked as expected in strict FIPS mode"
          echo "Output: ${output}"
        else
          echo "FAIL: binary failed but not with a FIPS panic"
          echo "Output: ${output}"
          exit 1
        fi
      '
