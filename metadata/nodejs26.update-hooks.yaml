# Patch the %nodejs_define_version macro line directly because the
# specfile library cannot trace through this custom macro.
update_spec: >-
  sed -Ei
  '/^%nodejs_define_version\s+node\>/s|:[0-9]+\.[0-9]+\.[0-9]+-|:'"${UPDATE_NEW_VERSION}"'-|'
  "${UPDATE_SPEC_FILE}"

# Download and strip the upstream tarball, then print the resulting
# filename. The script's own output is redirected to stderr so only
# the filename reaches stdout.
download_sources: |
  packaging/make-nodejs-tarball.sh "${UPDATE_NEW_VERSION}" >&2
  echo "node-v${UPDATE_NEW_VERSION}-stripped.tar.gz"

# Fill in component versions in the spec and clean up the unpacked
# source tree.
post_update: |
  packaging/fill-versions.sh "${UPDATE_SPEC_FILE}" "node-v${UPDATE_NEW_VERSION}-stripped.tar.gz"
  rm -rf "node-v${UPDATE_NEW_VERSION}"
