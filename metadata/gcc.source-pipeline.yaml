# gcc.spec has four sources, all git snapshots with no tagged release:
#
#   Source0 (gcc itself): pinned to %global gitrev, named gcc-%{version}-
#     %{DATE}.tar.xz. %{DATE} is NOT wall-clock "today" (unlike
#     update-gcc.sh's own `date --iso`, an arbitrary, unverifiable choice
#     with no relationship to the pinned commit) -- it's derived from the
#     pinned commit's own commit timestamp, so it's a pure, reproducible
#     function of the ref alone. Since that requires inspecting the commit
#     before the archive is fetched, and gorget's archive_name is a static
#     template resolved from ${VERSION} at invocation time (not something
#     a later post: step can retroactively rename -- Emit runs after Post
#     and only emits what Fetch already produced), VERSION here is a
#     composite "<rpm-version>-<DATE>" string computed *before* invoking
#     gorget:
#
#       git log -1 --format=%cd --date=format:%Y%m%d <new-gitrev>
#
#     Whoever refreshes this pin: pick the new gitrev, run the above
#     against it, then invoke gorget with
#     --version "<gcc_version>-<that date>" and update fetch.ref and the
#     post: step's literal gitrev argument below together.
#
#   Source1 (nvptx-tools) / Source2 (newlib-cygwin): pinned to their own
#     %global *_gitrev macros, simple git snapshots, no changelog logic.
#
#   Source3 (isl): a normal, version-tracked upstream release tarball.
#
# Note on Source2's manual recipe: gcc.spec's comment documents excluding
# newlib/libc/sys/linux/include/rpc/*.[hx] via git archive's pathspec
# syntax, but that path no longer exists in newlib-cygwin's tree (the RPC
# headers now live at newlib/libc/include/rpc/ with no .x files) -- the
# exclude has been a silent no-op for some time, since git archive doesn't
# error on a non-matching exclude pathspec. Confirmed Fedora's own
# currently-published tarball (matching the exact checksum already in
# sources) already ships newlib/libc/include/rpc/{types.h,xdr.h}. No
# transform step here reproduces that faithfully; "fixing" the stale
# exclude would change what's actually shipped, which is out of scope for
# a source-pipeline migration.
fetch:
  - type: git
    repo: "${UPSTREAM_REPO}"
    ref: "25040fb60e95bc8cb8eaa4b6706bd32591d95e7a"
    archive_name: "gcc-${VERSION}.tar.xz"

  - type: git
    repo: "https://github.com/MentorEmbedded/nvptx-tools.git"
    ref: "212da2e781ed0f9423824e85eb04819958513f7a"
    archive_name: "nvptx-tools-212da2e781ed0f9423824e85eb04819958513f7a.tar.xz"

  - type: git
    repo: "https://sourceware.org/git/newlib-cygwin.git"
    ref: "d35cc82b5ec15bb8a5fe0fe11e183d1887992e99"
    archive_name: "newlib-cygwin-d35cc82b5ec15bb8a5fe0fe11e183d1887992e99.tar.xz"

  # isl_version tracks its own release cadence, independent of gcc's own
  # ${VERSION} -- hardcoded like nvptx-tools/newlib-cygwin's pinned refs
  # above, not templated. Update this alongside %global isl_version in
  # gcc.spec when isl itself is bumped.
  - type: url
    url: "https://gcc.gnu.org/pub/gcc/infrastructure/isl-0.24.tar.bz2"

post:
  - type: run
    command:
      - "./gorget-update-changelog.sh"
      - "${SPEC_FILE}"
      - "25040fb60e95bc8cb8eaa4b6706bd32591d95e7a"

