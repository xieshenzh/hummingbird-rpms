# Source0/Source4 (bash-X.Y.tar.gz + its detached .sig) are named by base
# version only (e.g. "5.3") -- bash patchlevels 1..N are applied separately
# via the official upstream patch series, never folded into a new tarball.
#
# ftp.gnu.org has a well-documented history of unreliability (outages,
# multi-minute hangs, reported for years across unrelated projects). Fetches
# from ftpmirror.gnu.org instead, which redirects to a current, nearby
# mirror -- purely a CI-reliability choice, unrelated to Source0 (left
# unchanged, matching Fedora's own spec).
fetch:
  - type: url
    url: "https://ftpmirror.gnu.org/bash/bash-${VERSION_MAJOR}.${VERSION_MINOR}.tar.gz"
  - type: url
    url: "https://ftpmirror.gnu.org/bash/bash-${VERSION_MAJOR}.${VERSION_MINOR}.tar.gz.sig"

accepted-checksums:
  - file: "bash-5.3.tar.gz"
    checksum: "426702c8b0fb9e0c9956259973ce5b657890fd47f4f807a64febf20077bb48d0b91474ed6e843d2ef277186b46c5fffa79b808da9b48d4ec027d5e2de1b28ed8"
    reason: "One-time upstream re-publish of the bash-5.3.tar.gz base
      tarball: po/ka.gmo (compiled Georgian translation) regenerated with a
      different gettext/msgfmt version, plus a new po/stamp-po build
      marker -- confirmed via diffed extracted trees, no source/functional
      content differs. Reproducible across 3 independent fetches. The new
      tarball's detached signature verifies cleanly against Chet Ramey's
      already-trusted key (rpms/bash/chet-gpgkey.asc), confirming a
      legitimate re-publish, not tampering."
  - file: "bash-5.3.tar.gz.sig"
    checksum: "c77c0898f03e80a042574a486686cc296b96426f6cdb7a6d2376ecd5182ba03477bfcbd95ea3db499c11866d3f4ae99012a37662ccb6f83dfd6b59f671349dc7"
    reason: "Upstream issued a new detached signature to match the
      re-published bash-5.3.tar.gz above -- a signature is only valid for
      the exact bytes it was made over. Verified: gpg --verify against
      rpms/bash/chet-gpgkey.asc succeeds ('Good signature from Chet Ramey
      <chet@cwru.edu>')."
