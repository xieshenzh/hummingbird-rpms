fetch:
  - type: spec-update
    reset-release: "0.1"
    substitutions:
      - pattern: "^%global go_api\\s+[^\\s]+"
        replacement: "%global go_api ${VERSION_MAJOR}.${VERSION_MINOR}"
      - pattern: "^%global go_prerelease\\s+[^\\s]+"
        replacement: "#global go_prerelease rc2"
      - pattern: "^%global go_patch\\s+[^\\s]+"
        replacement: "%global go_patch ${VERSION_PATCH}"
  - type: spec-source
    index: 0

# Regenerate bundled dependency Provides from the new source tree.
post:
  - type: run
    artifacts: ["go${VERSION}.src.tar.gz"]
    command:
      - "sh"
      - "-c"
      - |
        set -euo pipefail
        tar xf "go${VERSION}.src.tar.gz"
        new_provides="$(cd go && bash "${PACKAGE_DIR}/bundled-deps.sh" | sed '/^$/d')"
        rm -rf go
        python3 -c "
        import sys, re
        spec = open(sys.argv[1]).read()
        pattern = r'(# Bundled/Vendored provides generated by bundled-deps\\.sh[^\\n]*\\n).*?\\n(\\nRequires:)'
        replacement = r'\\1' + sys.argv[2].rstrip() + r'\\n\\2'
        spec = re.sub(pattern, replacement, spec, flags=re.DOTALL)
        open(sys.argv[1], 'w').write(spec)
        " *.spec "$new_provides"
