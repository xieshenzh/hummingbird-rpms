# efi-rpm-macros' Source0 pointed at a GitHub release asset
# (efi-rpm-macros-6.tar.bz2) that has since been deleted from the release 6
# tag -- the tag itself still exists, but its asset list is empty (confirmed
# via the GitHub API; release 4 is also assetless, but 5/3/2/1 still have
# theirs).
#
# Verified against release 5 (still has its asset): diffed it against a
# plain git checkout of the same tag -- the only difference is that the
# real release tarball bundles a copy of efi-rpm-macros.spec inside itself,
# which this build doesn't use (Fedora's own dist-git spec is what actually
# drives the build, never the one inside Source0). So a git fetch of the
# release-6 tag is a faithful, functionally-equivalent substitute for the
# vanished asset.
fetch:
  - type: git
    repo: "${UPSTREAM_REPO}"
    ref: "${VERSION}"
    archive_name: "efi-rpm-macros-${VERSION}.tar.bz2"

accepted-checksums:
  - file: "efi-rpm-macros-6.tar.bz2"
    checksum: "fbf0a15f5dc39a67088f393be1b6717dcd67e160cf801b6d2d0517e9923b7279a8675a5fc36f5f94427f505cfeb30d811126c37683c0ceb40eaee6652ab98c77"
    reason: >-
      One-time transition: the original GitHub release asset for release
      6 was deleted upstream sometime after Fedora fetched it (confirmed
      via the GitHub API: the release-6 tag exists but has zero assets).
      Now generated by gorget's own git fetch (git archive + bz2, mtime
      pinned to the commit timestamp) instead. Content verified
      equivalent by cross-checking against release 5 (last version with
      a surviving asset): its release asset and a plain git checkout of
      the same tag differ only by a bundled copy of the RPM spec file,
      which this build doesn't use.
