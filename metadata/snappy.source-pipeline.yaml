# snappy's Source0 uses a releases/download/ URL pattern, but none of
# snappy's GitHub releases (1.1.9 through 1.2.2) have ever had an uploaded
# asset (confirmed via the GitHub API across every recent tag) -- this is a
# long-standing spec inaccuracy, not a regression from something that used
# to work. snappy is a plain CMake project (%autosetup, no autotools-style
# generated files to worry about), so a git fetch of the release tag is the
# closest thing to a real source this package has ever had.
fetch:
  - type: git
    repo: "${UPSTREAM_REPO}"
    ref: "${VERSION}"
    archive_name: "snappy-${VERSION}.tar.gz"

accepted-checksums:
  - file: "snappy-1.2.2.tar.gz"
    checksum: "6a0a21543519ce542f348de587ae20032c5d8f8ea012ad536ab867ffc368682b83b69ceb67d6d841603bef17e0cd0f85c4c501c385e3385a92db4ae57c03e46a"
    reason: >-
      One-time transition: this Source0 URL pattern has never actually
      resolved (confirmed via the GitHub API: none of snappy's releases
      have ever had uploaded assets), so the previously recorded
      checksum was almost certainly sourced from GitHub's own
      auto-generated tag archive by whoever originally packaged this.
      Now generated by gorget's own git fetch (git archive + gzip, mtime
      pinned to the commit timestamp) instead. snappy has git submodules
      (third_party/googletest, third_party/benchmark) that a plain
      fetch doesn't populate, but snappy-thirdparty.patch removes both
      add_subdirectory() calls that would have referenced them (switches
      to system gtest/gmock instead) -- confirmed the empty submodule
      dirs are never referenced after patching.
