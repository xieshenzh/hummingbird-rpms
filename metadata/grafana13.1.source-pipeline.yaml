fetch:
  - type: git
    repo: "${UPSTREAM_REPO}"
    ref: "v${VERSION}"
    archive_name: "grafana-${VERSION}.tar.gz"
  - type: vendor
    ecosystem: go
    archive_name: "grafana-${VERSION}-vendor.tar.bz2"

transform:
  - type: run
    path: "."
    command:
      - "sh"
      - "-c"
      - |
        set -euo pipefail
        # Apply every patch %prep will (in the same order), not just
        # grafana-yarn-cache.patch: the nanoid/axios/browserslist/dompurify CVE
        # patches also bump yarn.lock/package.json entries. Populating the
        # cache from the pristine (pre-CVE-patch) lockfile leaves it missing
        # whatever versions those patches bump to, so %build's own
        # `yarn install --immutable` (against the post-patch lockfile) fails
        # with "Cache entry required but missing" for exactly those packages.
        # (grafana-fast-uri-cve.patch/grafana-brace-postcss-cve.patch/
        # grafana-ip-address-cve.patch are no longer applied as of 13.1.3 --
        # upstream's own dependency bumps already satisfy those CVE fixes.)
        patch -p1 < "${PACKAGE_DIR}/grafana-yarn-cache.patch"
        patch -p1 < "${PACKAGE_DIR}/grafana-nanoid-cve.patch"
        patch -p1 < "${PACKAGE_DIR}/grafana-axios-cve.patch"
        patch -p1 < "${PACKAGE_DIR}/grafana-browserslist-cve.patch"
        # Must apply after the CVE patches above: pins compressionLevel and
        # carries the resulting full yarn.lock checksum regeneration (see
        # grafana-yarn-cache-compression.patch's own header comment).
        patch -p1 < "${PACKAGE_DIR}/grafana-yarn-cache-compression.patch"
        # Generated against the post-compression lockfile, so this comes after
        # grafana-yarn-cache-compression.patch (same order as Patch8 in the spec).
        patch -p1 < "${PACKAGE_DIR}/grafana-dompurify-cve.patch"
        # Generated against the post-DOMPurify-bump lockfile, so this comes
        # after grafana-dompurify-cve.patch (same order as Patch10 in the spec).
        patch -p1 < "${PACKAGE_DIR}/grafana-fast-uri-3.1.6-cve.patch"
        if [ -n "${HTTP_PROXY-}" ]; then export YARN_HTTP_PROXY="${HTTP_PROXY-}"; fi
        if [ -n "${HTTPS_PROXY-}" ]; then export YARN_HTTPS_PROXY="${HTTPS_PROXY-}"; fi
        # Unlike grafana12.4, 13.1's yarn.lock has no Cypress dependency to
        # suppress a binary download for.
        YARN_ENABLE_GLOBAL_CACHE=false YARN_CACHE_FOLDER=.yarn/cache \
          node .yarn/releases/yarn-*.cjs install --immutable
        # Deterministic flags: yarn's own cache writes carry live wall-clock
        # mtimes and directory listing order isn't guaranteed sorted, so a
        # plain `tar -cjf` here reproduced a different checksum on every
        # single run even with byte-identical cache contents.
        source_date_epoch=$(git log -1 --format=%ct HEAD)
        tar --sort=name --mtime="@${source_date_epoch}" \
          --owner=0 --group=0 --numeric-owner \
          -cjf "grafana-yarn-cache-${VERSION}.tar.bz2" .yarn/cache
    outputs:
      - "grafana-yarn-cache-${VERSION}.tar.bz2"

# Same-version yarn-cache regeneration (CVE npm bump) changes the archive
# checksum while keeping the filename, so gorget needs an accepted-checksums
# exception for the new hash.
accepted-checksums:
  - file: "grafana-yarn-cache-13.1.3.tar.bz2"
    checksum: "53b331361461213fd95732ddf87f3369d8b3e97111b3b50fb5e8adf8b460ad2fbfe82f7d5291c9233400b4d0541ee9eee8dbe9f700d103e1fa43e9b2dbc4b28d"
    reason: "grafana-fast-uri-3.1.6-cve.patch bumps fast-uri 3.1.5->3.1.6 for CVE-2026-76172/75975/75931/75899/CVE-2026-6322; yarn-cache regenerated to include the new zip"
