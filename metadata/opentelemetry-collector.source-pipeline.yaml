fetch:
  - type: url
    url: "https://github.com/open-telemetry/opentelemetry-collector-releases/archive/v${VERSION}/opentelemetry-collector-releases-${VERSION}.tar.gz"
    filename: "opentelemetry-collector-releases-${VERSION}.tar.gz"

transform:
  - type: run
    path: "opentelemetry-collector-releases-${VERSION}"
    command:
      - "sh"
      - "-c"
      - |
        set -euo pipefail
        # Hummingbird's build runners are amd64-only; revisit if that changes.
        curl -fSL -o "/tmp/ocb-${VERSION}" \
          "https://github.com/open-telemetry/opentelemetry-collector-releases/releases/download/cmd%2Fbuilder%2Fv${VERSION}/ocb_${VERSION}_linux_amd64"
        chmod +x "/tmp/ocb-${VERSION}"
        "/tmp/ocb-${VERSION}" --skip-compilation --config distributions/otelcol/manifest.yaml
        generated_files=(go.mod go.sum)
        while IFS= read -r f; do
          generated_files+=("$f")
        done < <(find _build -maxdepth 1 -name '*.go' -printf '%P\n' | sort)
        tar -C _build -cjf "opentelemetry-collector-${VERSION}-generated.tar.bz2" "${generated_files[@]}"
    outputs:
      - "opentelemetry-collector-${VERSION}-generated.tar.bz2"
  - type: vendor
    ecosystem: go
    archive_name: "opentelemetry-collector-${VERSION}-vendor.tar.bz2"
    modules:
      - path: "opentelemetry-collector-releases-${VERSION}/_build"
