# glibc.spec builds a development snapshot, not a tagged release: Source0's
# %{glibcsrcdir} macro (e.g. "glibc-2.43-47-gbc95068f5f") is Fedora's own
# `git describe --match 'glibc-*'` output against whatever upstream commit
# was last snapshotted -- there is no corresponding public release tarball,
# only this specific commit. Fetches that exact commit and archives it the
# same way `git describe`'s snapshot recipe (documented at the top of
# glibc.spec) does: an xz-compressed tarball named and internally prefixed
# with the describe string, so %autosetup -n %{glibcsrcdir} finds it as-is.
#
# No automated version-bump tracking (no track_upstream in glibc.json): each
# new snapshot is a manual decision by whoever refreshes glibc, who updates
# VERSION/ref below together with %{glibcsrcdir} in the spec, and adds/removes
# the corresponding accepted-checksums entry below.
fetch:
  - type: git
    repo: "${UPSTREAM_REPO}"
    ref: "bc95068f5f9d7f57d0f01757fed0900893b122b8"
    archive_name: "glibc-${VERSION}.tar.xz"

accepted-checksums:
  - file: "glibc-2.43-47-gbc95068f5f.tar.xz"
    checksum: "a7e9ef4385cf0db4676d5e903cad52fa833a1c281f5f3a13adea319fa7a6dc9817de2420768a7da6363c38962e61e28cc9142e7324f32dbca06e5aacce318569"
    reason: "One-time transition: now generated by gorget's own git fetch
      (git archive + xz, mtime pinned to the commit timestamp) instead of
      Fedora's own ad hoc snapshot process. Content verified identical
      (diffed extracted trees); only tar/xz container metadata differs."
