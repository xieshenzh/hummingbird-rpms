# drpm's Source0 pointed at a GitHub release asset (drpm-0.5.3.tar.bz2)
# that has since been deleted from the 0.5.3 release -- the tag itself
# still exists, but its asset list is empty (confirmed via the GitHub
# API). Older releases (0.5.2 and earlier) still have their assets.
#
# Verified drpm's official release tarballs are just plain `git archive`
# output with no dist-time generation: diffed the 0.5.2 release asset
# (still available) against a plain git checkout of the same tag --
# identical file list. drpm is a CMake project (no autotools-style
# generated configure/Makefile.in to worry about), and its one build-time
# generated target (`%cmake_build --target doc`) runs during the RPM's own
# %build, not at dist-tarball time. So a git fetch of the 0.5.3 tag is
# expected to be a faithful substitute for the vanished release asset.
fetch:
  - type: git
    repo: "${UPSTREAM_REPO}"
    ref: "${VERSION}"
    archive_name: "drpm-${VERSION}.tar.bz2"

accepted-checksums:
  - file: "drpm-0.5.3.tar.bz2"
    checksum: "3e6e3914478e490b87480bd781298582a07eab36909a357d24fc226bc004556871bdbe8e732c79e78ec373ac8f8902c194a115a57f8a2b4134dacd6a4ad30ea1"
    reason: >-
      One-time transition: the original GitHub release asset for 0.5.3
      was deleted upstream sometime after Fedora fetched it (confirmed
      via the GitHub API: the 0.5.3 release tag exists but has zero
      assets). Now generated by gorget's own git fetch (git archive +
      bz2, mtime pinned to the commit timestamp) instead. Content
      verified equivalent by cross-checking against 0.5.2 (last version
      with a surviving asset): its release asset and a plain git
      checkout of the same tag have an identical file list.
