fetch:
  - type: git
    repo: "${UPSTREAM_REPO}"
    ref: "v${VERSION}"
    archive_name: "grafana-${VERSION}.tar.gz"
  - type: vendor
    ecosystem: go
    archive_name: "grafana-${VERSION}-vendor.tar.bz2"

transform:
  - type: run
    path: "."
    command:
      - "sh"
      - "-c"
      - |
        set -euo pipefail
        # Apply every patch %prep will (in the same order), not just
        # grafana-yarn-cache.patch: the fast-uri/brace-postcss/browserslist-nanoid CVE patches
        # also bump yarn.lock/package.json entries (the other two patches
        # only touch a Go test file, harmless to apply here too). Populating
        # the cache from the pristine (pre-CVE-patch) lockfile leaves it
        # missing whatever versions those patches bump to, so %build's own
        # `yarn install --immutable` (against the post-patch lockfile) fails
        # with "Cache entry required but missing" for exactly those packages.
        patch -p1 < "${PACKAGE_DIR}/grafana-yarn-cache.patch"
        patch -p1 < "${PACKAGE_DIR}/disable-parallel-db-regression-tests.patch"
        patch -p1 < "${PACKAGE_DIR}/reset-begintx-test-deadline.patch"
        patch -p1 < "${PACKAGE_DIR}/grafana-fast-uri-cve.patch"
        patch -p1 < "${PACKAGE_DIR}/grafana-npm-cve-brace-postcss.patch"
        patch -p1 < "${PACKAGE_DIR}/grafana-ip-address-cve.patch"
        patch -p1 < "${PACKAGE_DIR}/grafana-browserslist-nanoid-cve.patch"
        # Must apply after the CVE patches above: pins compressionLevel and
        # carries the resulting full yarn.lock checksum regeneration (see
        # grafana-yarn-cache-compression.patch's own header comment).
        patch -p1 < "${PACKAGE_DIR}/grafana-yarn-cache-compression.patch"
        if [ -n "${HTTP_PROXY-}" ]; then export YARN_HTTP_PROXY="${HTTP_PROXY-}"; fi
        if [ -n "${HTTPS_PROXY-}" ]; then export YARN_HTTPS_PROXY="${HTTPS_PROXY-}"; fi
        CYPRESS_INSTALL_BINARY=0 YARN_ENABLE_GLOBAL_CACHE=false YARN_CACHE_FOLDER=.yarn/cache \
          node .yarn/releases/yarn-*.cjs install --immutable
        # Deterministic flags: yarn's own cache writes carry live wall-clock
        # mtimes and directory listing order isn't guaranteed sorted, so a
        # plain `tar -cjf` here reproduced a different checksum on every
        # single run even with byte-identical cache contents.
        source_date_epoch=$(git log -1 --format=%ct HEAD)
        tar --sort=name --mtime="@${source_date_epoch}" \
          --owner=0 --group=0 --numeric-owner \
          -cjf "grafana-yarn-cache-${VERSION}.tar.bz2" .yarn/cache
    outputs:
      - "grafana-yarn-cache-${VERSION}.tar.bz2"

# gorget 0.1.16 fixed a bug where a single-module Go vendor archive packed
# only "vendor/" at its top level, which go_vendor_license --use-archive
# mis-extracts as an independently-wrapped sibling of the source tree
# instead of nesting it inside -- causing every go-vendor-tools.toml license
# pin to spuriously report as "changed" in %check even though the vendor
# content itself was untouched (gorget-project/gorget#32). The fix adds
# go.mod/go.sum/go.work alongside vendor/, which changes this archive's own
# checksum without changing any dependency's resolved version or content.
accepted-checksums:
  - file: "grafana-12.4.8-vendor.tar.bz2"
    checksum: "ce08014af2e030665f58d5234558d9d72283856bbe6b2b667e49daf23343d600e851d5c76db96fd9883825d753e918f2f11e5a4ec4226bd73df5413a4cf1c478"
    reason: "gorget 0.1.16 fixes vendor archive layout (gorget-project/gorget#32); go.mod/go.sum/go.work added alongside vendor/, no dependency content changed"
  - file: "grafana-yarn-cache-12.4.8.tar.bz2"
    checksum: "c0784766cad3da424be7d5d08b7c3e5289960f91997de2b688fa2261e14ff7dbe567d3edfef68a2fdfd0c3331c26cfe35acbd0bcb3b31075b6e9437c698b4fab"
    reason: "grafana-browserslist-nanoid-cve.patch bumps browserslist 4.28.1->4.28.7 and nanoid 5.1.6->5.1.16 for CVE-2026-73089/73088/73086; grafana-yarn-cache-compression.patch regenerated to reflect yarn.lock changes"
