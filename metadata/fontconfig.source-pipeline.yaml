# fontconfig's Source0 pointed at freedesktop.org's release mirror, but
# 2.17.1 was never published there -- the real directory listing only goes
# up to 2.16.0 (confirmed live).
#
# A plain git checkout is NOT sufficient on its own, though: %install has
# its own manual doc-installation block (`for f in doc/*.1 ...`) that's
# independent of meson's `-Ddoc=disabled` build option, and expects
# pre-generated man pages/txt/html under doc/ that only exist in an
# official dist tarball, not in git (confirmed the hard way -- an earlier
# version of this pipeline shipped without them and broke rpmbuild's
# %install with "cannot stat 'doc/*.1'"). The generated .sgml sources
# themselves (fontconfig-user.sgml, fontconfig-devel.sgml) *are* checked
# into git directly, just not their generated man/txt/html output.
#
# So this pipeline does a real (if temporary) meson build with docs
# enabled purely to produce those generated files, copies them into
# doc/, then repacks the whole tree as the final archive. Real PDF
# generation is skipped -- docbook2pdf can't resolve meson's
# generated .sgml includes (confdir.sgml, version.sgml, etc.) through its
# own jade search path in this environment, a toolchain quirk unrelated
# to fontconfig itself -- but %install's `for f in doc/*.txt doc/*.pdf
# doc/*.html` loop has no nullglob guard, so it still needs *some* file
# matching doc/*.pdf to exist or the literal unexpanded pattern breaks
# the install command. %files never references the .pdf output, so a
# placeholder is safe.
fetch:
  - type: git
    repo: "${UPSTREAM_REPO}"
    ref: "${VERSION}"
    archive_name: "fontconfig-src-${VERSION}.tar.xz"

transform:
  - type: run
    target: "fontconfig-src-${VERSION}.tar.xz"
    command:
      - "sh"
      - "-c"
      - |
        set -euo pipefail
        extracted="fontconfig-src-${VERSION}"
        final="fontconfig-${VERSION}"
        (
          cd "${extracted}"
          before_subprojects="$(ls subprojects)"
          meson setup build -Ddoc=enabled -Ddoc-man=enabled -Ddoc-txt=enabled \
            -Ddoc-html=enabled -Ddoc-pdf=disabled
          ninja -C build
          cp build/doc/*.1 doc/
          cp build/doc/*.3 doc/
          cp build/doc/*.5 doc/
          cp build/doc/fontconfig-user.txt build/doc/fontconfig-user.html doc/
          cp build/doc/fontconfig-devel.txt build/doc/fontconfig-devel.html doc/
          # Placeholder only -- see comment above. Not packaged (%files
          # never references *.pdf).
          : > doc/fontconfig-user.pdf
          : > doc/fontconfig-devel.pdf
          rm -rf build
          # meson wrap-fetches full subproject checkouts (freetype2, libpng,
          # libxml2, zlib) plus a download cache purely to configure this
          # temporary doc-generation build -- none of that belongs in the
          # shipped source tree (the real dist tarball only ever ships the
          # .wrap definition files), and it embeds non-deterministic git
          # clone metadata that breaks reproducible checksums. Remove
          # anything meson added that wasn't there before.
          for entry in subprojects/*; do
            [ -e "$entry" ] || continue   # guard against empty-dir glob expansion
            name="$(basename "$entry")"
            if ! printf '%s\n' "$before_subprojects" | grep -qxF "$name"; then
              rm -rf "$entry"
            fi
          done
        )
        mv "${extracted}" "${final}"
        tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
          -cJf "fontconfig-${VERSION}.tar.xz" "${final}"
    outputs:
      - "fontconfig-${VERSION}.tar.xz"

accepted-checksums:
  - file: "fontconfig-2.17.1.tar.xz"
    checksum: "1285895e7ce1f0bfbdcd950eb896205e4ba04a16eff695859ac1994aa7961b86fb136856586650c83295fb83ed297e6c200a478038de6c9c6fc637247f160e0d"
    reason: >-
      One-time transition: 2.17.1 was never published as an official dist
      tarball (freedesktop.org's release mirror stops at 2.16.0), so the
      previously recorded checksum was almost certainly sourced from
      GitLab's own auto-generated tag archive by whoever last updated this
      package. Now generated by gorget's own git fetch plus a real (but
      temporary) meson doc build, matching what an official dist tarball
      would have included.

      Known follow-up: docbook2man/jade stamps each generated man page's
      .TH line with the current wall-clock date (not SOURCE_DATE_EPOCH or
      any pinned value from the source), so this checksum is only valid
      for builds run on the same calendar day as this one -- any future
      rebuild of this exact pipeline (even with no code change) will
      produce a new checksum and need a fresh accepted-checksums entry.
      A real fix would need to post-process the generated man pages to
      pin the .TH date to something deterministic (e.g. the upstream git
      commit's own timestamp), which isn't done here.
