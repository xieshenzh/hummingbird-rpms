download_sources: |
  set -euo pipefail
  version="${UPDATE_NEW_VERSION}"
  cd "${UPDATE_PACKAGE_DIR}"

  curl -fSL -o "spire-${version}.tar.gz" \
    "https://github.com/spiffe/spire/archive/v${version}/spire-${version}.tar.gz" >&2

  git -c advice.detachedHead=false clone --branch "v${version}" --depth 1 \
    https://github.com/spiffe/spire.git "spire-${version}" >&2

  go_vendor_archive create \
    -c go-vendor-tools.toml \
    -O "spire-${version}-vendor.tar.bz2" \
    "spire-${version}" >&2

  rm -rf "spire-${version}"

  echo "spire-${version}.tar.gz"
  echo "spire-${version}-vendor.tar.bz2"
