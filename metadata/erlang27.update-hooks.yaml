# jinterface's own version (lib/jinterface/vsn.mk) doesn't track the OTP
# release version, so it can't be derived from %{version}. Read it out of
# the freshly-downloaded tarball and patch the %global by hand, same as
# Fedora's maintainer does manually on every bump.
post_update: |
  jinterface_ver="$(tar -xOf "otp-OTP-${UPDATE_NEW_VERSION}.tar.gz" \
    --wildcards '*/lib/jinterface/vsn.mk' | grep -oP 'VSN\s*=\s*\K\S+')"
  if [ -z "${jinterface_ver}" ]; then
    echo "post_update: could not extract jinterface VSN from tarball" >&2
    exit 1
  fi
  sed -Ei "s/^%global jinterface_ver .*/%global jinterface_ver ${jinterface_ver}/" "${UPDATE_SPEC_FILE}"
