# Source0 (ftp.altlinux.org) is dead -- confirmed via a real FTP session,
# that directory only contains versions up through 2.2.0 (from 2019).
#
# A plain git checkout is NOT sufficient on its own: %build calls
# %configure (./configure) directly, with no autoreconf/autogen step in
# %prep, but the real ./configure script is generated by autotools and is
# NOT checked into git (only configure.ac + autogen.sh are) -- confirmed by
# cloning the v${VERSION} tag directly. The official dist tarball ships the
# pre-generated configure script; a raw git-archive snapshot (e.g.
# git.kernel.org's own .../snapshot/kbd-${VERSION}.tar.gz endpoint) does
# not, and would break %build immediately with "configure: No such file".
#
# So this pipeline runs the real autogen.sh (autopoint/libtoolize/aclocal/
# autoconf/autoheader/automake, exactly as a real release process would)
# against the git checkout to produce a working configure script and the
# rest of the generated build-system files, then repacks the tree under the
# default %{name}-%{version} directory name %setup expects (kbd.spec has no
# custom -n override).
fetch:
  - type: git
    repo: "${UPSTREAM_REPO}"
    ref: "v${VERSION}"
    archive_name: "kbd-src-${VERSION}.tar.xz"

transform:
  - type: run
    target: "kbd-src-${VERSION}.tar.xz"
    command:
      - "sh"
      - "-c"
      - |
        set -euo pipefail
        extracted="kbd-src-${VERSION}"
        final="kbd-${VERSION}"
        (
          cd "${extracted}"
          ./autogen.sh
          rm -rf autom4te.cache
          # autoconf archive's AX_AM_MACROS_STATIC macro stamps a wall-clock
          # generation timestamp into a comment in these two files, making
          # every run produce a different checksum even with identical
          # inputs. Purely a comment, no functional effect -- normalize it.
          sed -i 's/^# from AX_AM_MACROS_STATIC on .*/# from AX_AM_MACROS_STATIC/' \
            aminclude_static.am Makefile.in
        )
        mv "${extracted}" "${final}"
        tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
          -cJf "kbd-${VERSION}.tar.xz" "${final}"
    outputs:
      - "kbd-${VERSION}.tar.xz"

accepted-checksums:
  - file: "kbd-2.10.0.tar.xz"
    checksum: "4701c99a63849fa68a105407bb43eb61b8755a66c9b50d29fb7e532d96932dd5d9bfc7a20a5d63b658aea08b67ec642b9c8e9d71c077b6e52f02537cefed698c"
    reason: >-
      One-time transition from ftp.altlinux.org (dead, directory only goes
      up to 2.2.0) to gorget's git fetch plus a real (but temporary)
      autotools bootstrap (autogen.sh), matching what the official dist
      tarball would have included. Content of configure.ac and all
      hand-written sources verified identical to the git tag; the
      generated configure/Makefile.in/etc. files are freshly regenerated
      by this pipeline rather than diffed against the original (that
      tarball is no longer available anywhere to compare against).
