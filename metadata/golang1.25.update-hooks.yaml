# Update go_patch and Release macros directly because Version is derived
# from %{go_api}.%{go_patch} and the specfile library cannot trace that.
update_spec: |
  patch="${UPDATE_NEW_VERSION##*.}"
  sed -Ei \
    -e 's/^(%global go_patch\s+)[0-9]+/\1'"${patch}"'/' \
    -e 's/^(Release:\s+)[^ ]+/\10.1%{?dist}/' \
    "${UPDATE_SPEC_FILE}"

# Regenerate bundled dependency Provides from the new source tree.
post_update: |
  tarball="go${UPDATE_NEW_VERSION}.src.tar.gz"
  tar xf "${tarball}"
  new_provides="$(cd go && bash "${UPDATE_PACKAGE_DIR}/bundled-deps.sh" | sed '/^$/d')"
  rm -rf go

  # Replace the block between the bundled-deps comment and the blank line
  # before Requires: with freshly generated provides.
  python3 -c "
  import sys, re
  spec = open(sys.argv[1]).read()
  pattern = r'(# Bundled/Vendored provides generated by bundled-deps\.sh[^\n]*\n).*?\n(\nRequires:)'
  replacement = r'\1' + sys.argv[2].rstrip() + r'\n\2'
  spec = re.sub(pattern, replacement, spec, flags=re.DOTALL)
  open(sys.argv[1], 'w').write(spec)
  " "${UPDATE_SPEC_FILE}" "${new_provides}"
