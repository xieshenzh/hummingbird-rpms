# Required to prevent running out of storage
rust:
  timeout_hours: 12
  build_platforms:
    - "linux-d160-c8xlarge/arm64"
    - "linux-d160-c8xlarge/amd64"
  # Required to prevent Syft OOMing during SBOM generation
  task_run_specs:
    - pipelineTaskName: rpmbuild
      stepSpecs:
        - name: run-syft
          computeResources:
            requests:
              memory: 10Gi
            limits:
              memory: 10Gi

rust-rpm-sequoia:
