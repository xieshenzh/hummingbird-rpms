# This file contains per-package overrides for build configuration.
# If a package is not listed in this file, it will use default settings.
#
# Available options per package:
#   timeout_hours: Override the default build timeout (default: 4 hours)
#   build_platforms: Override the default MPLs (instance sizes) for builds
#   forked_from: Override the upstream dist-git repository URL for lookaside cache resolution
#                (default: https://src.fedoraproject.org/rpms/<package-name>)
#   lookaside_cache_url: URL of a private lookaside cache (CloudFront distribution) for
#                        downloading source tarballs with signed URLs. When set, the pipeline
#                        bypasses dist-git-client. Requires the cloudfront-signing-key secret.
#   private_product: Route this package to a private per-product Pulp repository
#                    instead of (or in addition to) the public one. The value is the
#                    product name (e.g., "example", "dotnet") which must match an entry
#                    in ci/konflux_rpa_config.yml.
#
# Example:
# llvm:
#   timeout_hours: 12
#   build_platforms:
#     - "linux-d160-c8xlarge/arm64"
#     - "linux-d160-c8xlarge/amd64"
#   task_run_specs:
#     # pipelineTaskName: rpmbuild expands to rpmbuild-x86-64 and rpmbuild-aarch64 (see generate_resources.py)
#     - pipelineTaskName: rpmbuild
#       stepSpecs:
#         - name: run-syft
#           computeResources:
#             requests:
#               memory: 10Gi
#             limits:
#               memory: 10Gi
#
# All available MPLs can be found in the:
# https://konflux.pages.redhat.com/docs/users/getting-started/multi-platform-builds.html documentation.

# Anchor for the common private lookaside cache URL, aliased below as
# *private_lookaside_cache_url to avoid repeating the literal string for every package.
_private_lookaside_cache_url: &private_lookaside_cache_url "https://dp9y1t38f72i0.cloudfront.net/"

