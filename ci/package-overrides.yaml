# This file contains per-package overrides for build configuration.
# If a package is not listed in this file, it will use default settings.
#
# Available options per package:
#   timeout_hours: Override the default build timeout (default: 4 hours)
#   build_platforms: Override the default MPLs (instance sizes) for builds
#   forked_from: Override the upstream dist-git repository URL for lookaside cache resolution
#                (default: https://src.fedoraproject.org/rpms/<package-name>)
#
# Example:
# llvm:
#   timeout_hours: 12
#   build_platforms:
#     - "linux-d160-c8xlarge/arm64"
#     - "linux-d160-c8xlarge/amd64"
#   task_run_specs:
#     # pipelineTaskName: rpmbuild expands to rpmbuild-x86-64 and rpmbuild-aarch64 (see generate_resources.py)
#     - pipelineTaskName: rpmbuild
#       stepSpecs:
#         - name: run-syft
#           computeResources:
#             requests:
#               memory: 10Gi
#             limits:
#               memory: 10Gi
#
# All available MPLs can be found in the:
# https://konflux.pages.redhat.com/docs/users/getting-started/multi-platform-builds.html documentation.

