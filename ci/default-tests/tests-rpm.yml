---
# Default tests for all default (runtime) rpms
# These are minimal tests that should pass for all rpms
hum-suffix-check:
  command: |
    # Verify the RPM was built with the Hummingbird dist suffix (.hum<N>)
    # rather than the default Fedora suffix (.fc<NN>)
    release=$(rpm -qp --queryformat '%{RELEASE}' "${TEST_RPM:?}")

    # Check that release contains .hum<N> suffix
    if [[ ! ${release} =~ \.hum[0-9]+$ ]]; then
      TEST_FAIL "RPM release '${release}' does not have .hum<N> suffix - mock configuration may not be working correctly"
    fi

    echo "RPM release '${release}' has correct Hummingbird suffix"

rpm-integrity-check:
  command: |
    rpm -K "${TEST_RPM:?}"
    rpm -qip "${TEST_RPM:?}"
    rpm -qlp "${TEST_RPM:?}"
    rpm -qRp "${TEST_RPM:?}"

rpm-install:
  command: |
    # Test installing the RPM using dnf-installroot in a container

    # Get the package name from the RPM
    rpm_name=$(rpm -qp --queryformat '%{NAME}' "${TEST_RPM}")

    # Create a temporary directory for the local repository
    build_dir=$(mktemp -d)

    # Ensure cleanup on exit
    cleanup() {
      rm -rf "${build_dir}"
    }
    trap cleanup EXIT

    # Create local-repo directory
    mkdir -p "${build_dir}/local-repo"

    # Determine which RPMs to include in the local repository
    if [[ -n ${TEST_REPO_DIR:-} ]]; then
      # Use all RPMs from the repository directory
      rpm_files=("${TEST_REPO_DIR}"/*.rpm)
    else
      # Fall back to just the test RPM
      rpm_files=("${TEST_RPM}")
    fi

    # Copy RPM files to local-repo
    for rpm_file in "${rpm_files[@]}"; do
      cp "${rpm_file}" "${build_dir}/local-repo/"
    done

    # Run createrepo_c to generate repository metadata
    if command -v createrepo_c &>/dev/null; then
      # Use native createrepo_c if available (faster, no container overhead)
      createrepo_c "${build_dir}/local-repo"
    else
      # Fall back to container
      "${TEST_ENGINE}" run --rm --user 0 -e HOME=/root \
        -v "${build_dir}/local-repo:/repo:z" \
        quay.io/hummingbird-ci/hummingbird-builder:latest \
        createrepo_c /repo
    fi

    echo "Created local repository with $(ls -1 "${build_dir}/local-repo/"*.rpm | wc -l) RPM(s)"

    # Run installation test in a container
    # Mount repo configs and local-repo, run all operations in a single bash script
    "${TEST_ENGINE}" run --rm \
      --cap-add=ALL \
      -v "${CI_REPOS_DIR}:/tmp/repos:ro,z" \
      -v "${build_dir}/local-repo:/tmp/local-repo:ro,z" \
      quay.io/hummingbird-ci/hummingbird-builder:latest \
      bash -c '
        set -e  # Exit immediately on any error

        # Copy repo configurations
        cp /tmp/repos/fedora-43.repo /etc/yum.repos.d/
        cp /tmp/repos/hummingbird.repo /etc/yum.repos.d/

        # Create local.repo config
        printf "%s\n" \
          "[local-repo]" \
          "name=Local Repository" \
          "baseurl=file:///tmp/local-repo" \
          "enabled=1" \
          "gpgcheck=0" \
          "priority=1" \
          > /etc/yum.repos.d/local.repo

        # Define DNF variables
        NEWROOT=/new-root-fs
        DNF_CACHE=/tmp/dnf-cache
        DNF_FLAGS="-y --use-host-config --nodocs --setopt=install_weak_deps=False --setopt=cachedir=${DNF_CACHE} --setopt=system_cachedir=${DNF_CACHE} --setopt=logdir=${DNF_CACHE} --setopt=varsdir=${DNF_CACHE}"

        # Create new root directory
        mkdir -p "${NEWROOT}"

        # Import GPG key
        rpmkeys --import /etc/pki/rpm-gpg/RPM-GPG-KEY-fedora-43-primary --root "${NEWROOT}"

        # Install filesystem first, then the test package
        dnf-installroot "${NEWROOT}" ${DNF_FLAGS} install filesystem
        dnf-installroot "${NEWROOT}" ${DNF_FLAGS} install '"${rpm_name}"'

        # Verify the package was installed from local-repo
        install_repo=$(dnf --installroot="${NEWROOT}" info --installed '"${rpm_name}"' 2>/dev/null | \
          grep "^From repo" | cut -d: -f2 | tr -d " ")

        if [ "${install_repo}" != "local-repo" ]; then
          echo "Error: Package '"'${rpm_name}'"' was not installed from local-repo (got: ${install_repo:-unknown})"
          exit 1
        fi

        echo "Verified: '"${rpm_name}"' installed from local-repo"

        # Verify ELF binaries that have CPE strings contain the Hummingbird CPE
        CPE_STRING="cpe:/a:redhat:hummingbird:1"

        # Install tools needed for CPE check (after package validation)
        if ! dnf ${DNF_FLAGS} install binutils file >/dev/null 2>&1; then
          echo "ERROR: Failed to install binutils and file packages needed for CPE check"
          exit 1
        fi

        # Get list of files installed by the package and find ELF binaries
        mapfile -t elf_files < <(rpm --root="${NEWROOT}" -ql '"${rpm_name}"' | \
          sed "s|^|${NEWROOT}|" | \
          xargs -r file 2>/dev/null | \
          grep -E ": +ELF " | \
          cut -d: -f1)

        if [ ${#elf_files[@]} -eq 0 ]; then
          echo "No ELF binaries found in package - skipping CPE check"
          exit 0
        fi

        echo "Checking ${#elf_files[@]} ELF binary/binaries for CPE string: ${CPE_STRING}"

        failed_files=()
        skipped_files=0
        checked_files=0
        for elf_file in "${elf_files[@]}"; do
          # Check if the binary has a .note.package section with any CPE
          note_content=$(readelf -p .note.package "${elf_file}" 2>/dev/null || true)
          if [ -z "${note_content}" ] || ! echo "${note_content}" | grep -qF "cpe:/"; then
            # No .note.package section or no CPE string - skip this binary
            skipped_files=$((skipped_files + 1))
            continue
          fi

          # Binary has a CPE - verify it contains the Hummingbird CPE
          checked_files=$((checked_files + 1))
          if ! echo "${note_content}" | grep -qF "${CPE_STRING}"; then
            # Get path relative to NEWROOT for cleaner output
            rel_path="${elf_file#${NEWROOT}}"
            failed_files+=("${rel_path}")
          fi
        done

        if [ ${#failed_files[@]} -gt 0 ]; then
          echo "The following ELF binaries have a CPE but do not contain ${CPE_STRING}:"
          for f in "${failed_files[@]}"; do
            echo "  - ${f}"
          done
          echo "ERROR: Found ${#failed_files[@]} ELF binary/binaries with incorrect CPE in .note.package header"
          exit 1
        fi

        if [ ${checked_files} -eq 0 ]; then
          echo "No ELF binaries with CPE strings found - skipping CPE verification"
        else
          echo "Verified ${checked_files} ELF binary/binaries contain the correct CPE string (${skipped_files} without CPE skipped)"
        fi
      '

# Source RPM tests (only run when --src-rpm is provided)
src-rpm-hum-suffix-check:
  command: |
    # Only run if TEST_SRC_RPM is provided
    if [[ -z ${TEST_SRC_RPM} ]]; then
      echo "Skipping: No source RPM provided"
      exit 0
    fi

    # Verify the source RPM was built with the Hummingbird dist suffix (.hum<N>)
    # rather than the default Fedora suffix (.fc<NN>)
    release=$(rpm -qp --queryformat '%{RELEASE}' "${TEST_SRC_RPM}")

    # Check that release contains .hum<N> suffix
    if [[ ! ${release} =~ \.hum[0-9]+$ ]]; then
      TEST_FAIL "Source RPM release '${release}' does not have .hum<N> suffix - mock configuration may not be working correctly"
    fi

    echo "Source RPM release '${release}' has correct Hummingbird suffix"

src-rpm-name-check:
  command: |
    # Only run if TEST_SRC_RPM is provided
    if [[ -z ${TEST_SRC_RPM} ]]; then
      echo "Skipping: No source RPM provided"
      exit 0
    fi

    # Verify the SRPM name matches the package directory name
    srpm_name=$(rpm -qp --queryformat '%{NAME}' "${TEST_SRC_RPM}")

    if [[ ${srpm_name} != "${PACKAGE_NAME}" ]]; then
      TEST_FAIL "SRPM name '${srpm_name}' does not match directory name '${PACKAGE_NAME}' - the spec Name: field must match the rpms/ directory name"
    fi

    echo "SRPM name '${srpm_name}' matches directory name '${PACKAGE_NAME}'"

src-rpm-integrity-check:
  command: |
    # Only run if TEST_SRC_RPM is provided
    if [[ -z ${TEST_SRC_RPM} ]]; then
      echo "Skipping: No source RPM provided"
      exit 0
    fi

    # Check source RPM signature and metadata
    rpm -K "${TEST_SRC_RPM}"
    rpm -qip "${TEST_SRC_RPM}"
    rpm -qlp "${TEST_SRC_RPM}"
