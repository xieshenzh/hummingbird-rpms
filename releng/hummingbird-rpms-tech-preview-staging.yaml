  origin: hummingbird-tenant
  pipeline:
    pipelineRef:
      params:
        - name: url
          value: https://github.com/scoheb/release-service-catalog.git
        - name: revision
          value: hummingbird-rpm-signing
        - name: pathInRepo
          value: "pipelines/managed/push-rpms-to-pulp/push-rpms-to-pulp.yaml"
      resolver: git
    taskRunSpecs:
      - pipelineTaskName: populate-release-notes
        stepSpecs:
          - computeResources:
              limits:
                cpu: '1'
                memory: 256Mi
              requests:
                cpu: '1'
                memory: 256Mi
            name: populate-release-notes-artifacts
      - pipelineTaskName: upload-src-rpm-sbom-attestation
        stepSpecs:
          - computeResources:
              limits:
                memory: 1Gi
              requests:
                cpu: '1'
                memory: 1Gi
            name: upload
        # increase limits for verify-conforma to 8Gi memory and 2 cpu
        # that is needed for rust
      - pipelineTaskName: verify-conforma
        stepSpecs:
          - computeResources:
              limits:
                cpu: '2'
                memory: 8Gi
              requests:
                cpu: '2'
                memory: 8Gi
            name: validate
    serviceAccountName: hummingbird-rpm-release-staging
    timeouts:
      pipeline: 4h0m0s
      tasks: 4h0m0s
  policy: rpm-hummingbird-stage
