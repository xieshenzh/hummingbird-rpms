# --- PyYAML ---
---
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://gitlab.com/redhat/hummingbird/rpms/-/tree/{{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/on-target-branch: "[main]"
    pipelinesascode.tekton.dev/cancel-in-progress: "false"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-event: "[push]"
    pipelinesascode.tekton.dev/on-path-change: "[rpms/PyYAML/***]"
  creationTimestamp: null
  labels:
    appstudio.openshift.io/application: rpms-main
    appstudio.openshift.io/component: pyyaml-main
    pipelines.appstudio.openshift.io/type: build
  name: pyyaml-main-on-push
  namespace: hummingbird-tenant
spec:
  params:
    - name: git-url
      value: '{{source_url}}'
    - name: revision
      value: '{{revision}}'
    - name: ociStorage
      value: quay.io/redhat-user-workloads/hummingbird-tenant/pyyaml-main:{{revision}}
    - name: package-name
      value: PyYAML
    - name: target-branch
      value: '{{target_branch}}'
    - name: build-architectures
      value:
        - aarch64
        - x86_64
    - name: build-platforms
      value:
        - "linux/x86_64"
        - "linux/arm64"
    - name: specfile
      value: "PyYAML.spec"
    - name: monorepo-subdir
      value: "rpms/PyYAML"
    - name: mock-config-template-filename-in-sources
      value: "mock/mock.cfg"
  pipelineRef:
    resolver: bundles
    params:
      - name: name
        value: build-rpm-package
      - name: kind
        value: pipeline
      - name: bundle
        # renovate: datasource=docker depName=quay.io/hummingbird-ci/rpmbuild-pipeline
        value: "quay.io/hummingbird-ci/rpmbuild-pipeline:latest@sha256:df897187705c82ef4fa28e4e5c9ba7861e3fd17a8980d8f25c26db485f220b0d"
  taskRunTemplate:
    serviceAccountName: build-pipeline-pyyaml-main
  timeouts:
    pipeline: 4h
    tasks: 4h
  workspaces:
    - name: git-auth
      secret:
        secretName: '{{git_auth_secret}}'
