[[licensing.licenses]]
# hamba/avro is replaced by iskorotkov/avro in go.mod, but go mod vendor
# stores files under the original module path.  British spelling ("LICENCE")
# is not detected by askalono, so an explicit override is needed.
path = "vendor/github.com/hamba/avro/v2/LICENCE"
sha256sum = "624cb79ad8b19d883131a90baf6ab3003e01cece97287452a438b8670963022d"
expression = "MIT"

