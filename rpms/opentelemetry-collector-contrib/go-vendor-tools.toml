[archive]
# No go_mod_dir: create-vendor-tarball.sh passes _build/ directly to
# go_vendor_archive create, so it vendors from there without a subdirectory prefix.
post_commands = [
  ["curl", "-fSL", "-o", "vendor/bitbucket.org/atlassian/go-asap/v2/LICENSE", "https://bitbucket.org/atlassian/go-asap/raw/HEAD/LICENSE.txt"],
  ["curl", "-fSL", "-o", "vendor/modernc.org/memory/LICENSE", "https://gitlab.com/cznic/memory/-/raw/master/LICENSE"],
  ["cp", "vendor/github.com/hamba/avro/v2/LICENCE", "vendor/github.com/iskorotkov/avro/v2/LICENCE"],
  # Go 1.27 rejects crypto.RegisterHash(Hash(0), ...). SermoDigital/jose's
  # crypto/none.go registers the JOSE "none" alg against hash id 0 in init(),
  # so otelcol-contrib panics at startup before main (MR !4258 Konflux
  # functionality test). The library is unmaintained (no upstream push since
  # ~2018), so there is no go1.27-compatible release to pin — same situation
  # tracked in https://github.com/cloudfoundry/cli/issues/3851. Their
  # workaround is a go.mod replace to a fork with the RegisterHash call
  # removed (safe: "none" is installed into the jws signing-method map via a
  # map literal, Sign/Verify are no-ops, and nothing calls Available() on
  # it). Apply the same edit here against the vendored copy so the RPM build
  # does not need a published fork. Drop once asapauthextension/go-asap no
  # longer pull in SermoDigital/jose.
  ["sed", "-i", "/crypto\\.RegisterHash(crypto\\.Hash(0), h)/d", "vendor/github.com/SermoDigital/jose/crypto/none.go"],
]

[licensing]
detector = "askalono"
exclude_files = [
  "vendor/github.com/DataDog/datadog-api-client-go/v2/LICENSE-3rdparty.csv",
  "vendor/github.com/DataDog/sketches-go/LICENSE-3rdparty.csv",
  "vendor/github.com/aws/aws-lambda-go/LICENSE-SUMMARY",
  "vendor/modernc.org/memory/LICENSE-LOGO",
  "vendor/modernc.org/sqlite/SQLITE-LICENSE",
]

[[licensing.licenses]]
path = "vendor/github.com/digitalocean/godo/LICENSE.txt"
sha256sum = "946d0e939f736a9d7061ea06591818107fb12d3cddad70ee81667b85f7f24c22"
expression = "MIT"

