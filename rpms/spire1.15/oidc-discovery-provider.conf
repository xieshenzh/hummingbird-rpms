# Minimal SPIRE OIDC Discovery Provider configuration for Hummingbird.
#
# Serves the discovery document/JWKS over a Unix domain socket rather than
# terminating TLS itself, so it can sit behind a reverse proxy without ACME
# or manually managed certificates. Before deploying, set `domains` to the
# hostname(s) the provider is actually served from.
log_level = "info"
domains = ["example.org"]

listen_socket_path = "/var/lib/spire/oidc-discovery-provider/oidc-discovery-provider.sock"
allow_insecure_scheme = true

server_api {
    address = "unix:///var/lib/spire/server/private/api.sock"
}
