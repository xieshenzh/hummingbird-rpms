# Minimal SPIRE Server configuration for Hummingbird.
#
# This starts a self-signed, single-node SPIRE Server usable out of the box
# for evaluation. Before deploying against a real trust domain, review and
# change at least:
#   - trust_domain
#   - bind_address (defaults to loopback only)
server {
    bind_address = "127.0.0.1"
    bind_port = "8081"
    socket_path = "/var/lib/spire/server/private/api.sock"
    trust_domain = "example.org"
    data_dir = "/var/lib/spire/server"
    log_level = "INFO"
}

plugins {
    DataStore "sql" {
        plugin_data {
            database_type = "sqlite3"
            connection_string = "/var/lib/spire/server/datastore.sqlite3"
        }
    }

    NodeAttestor "join_token" {
        plugin_data {
        }
    }

    KeyManager "disk" {
        plugin_data {
            keys_path = "/var/lib/spire/server/keys.json"
        }
    }
}
