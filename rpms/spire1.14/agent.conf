# Minimal SPIRE Agent configuration for Hummingbird.
#
# Unlike the server, the agent cannot start with defaults alone: it must be
# pointed at a real SPIRE Server and trust bundle before it can attest to it.
# Before running spire-agent:
#   - set trust_domain to match the server's trust domain
#   - set server_address/server_port to the SPIRE Server's bind address
#   - set trust_bundle_path to the server's initial trust bundle (see
#     `spire-server bundle show`), or use trust_bundle_url /
#     insecure_bootstrap for automated bootstrapping
agent {
    data_dir = "/var/lib/spire/agent"
    log_level = "INFO"
    server_address = "127.0.0.1"
    server_port = "8081"
    socket_path = "/var/lib/spire/agent/public/api.sock"
    trust_domain = "example.org"
    # trust_bundle_path = "/etc/spire/agent/bootstrap.crt"
}

plugins {
    NodeAttestor "join_token" {
        plugin_data {
        }
    }

    KeyManager "disk" {
        plugin_data {
            directory = "/var/lib/spire/agent"
        }
    }

    WorkloadAttestor "unix" {
        plugin_data {
        }
    }
}
